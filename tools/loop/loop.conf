# tools/loop/loop.conf — the loop's recorded run defaults, and the three keys that are this project's.
#
# The loop's engine is portable: the queue, the worktree, the phases, the gate discipline, the stop
# conditions and the report name no skill, no command and no project value. Everything that IS this
# project's lives here, and nowhere else (design D16). A second project edits this file and
# `tools/tooling.json`; it never edits a phase or a prompt skeleton. Which value of the profile's
# namespaces each of the loop's decisions means lives in the profile's `roles` section, read through
# `lib.sh`'s `loop_role` and enforced by the portability check.
#
# Sourced by `tools/loop/lib.sh` (and through it by every script and prompt renderer). Override the
# whole file with `LOOP_CONF=<path>`, which is what the loop self-test does to prove the seam.

# ── the budget defaults (D2) ─────────────────────────────────────────────────────────────────────
# Every flag `run.sh` accepts is recorded here, and an omitted flag takes this value: a script cannot
# ask, so the budget is a file plus arguments rather than a dialogue.
LOOP_ITEMS_DEFAULT=3
LOOP_MINUTES_DEFAULT=90
LOOP_REVIEW_DEFAULT=on
LOOP_MAY_CLOSE_DEFAULT=yes
LOOP_MAX_DECISIONS_DEFAULT=10
# The ceiling of open `agent/needs-decision` items that refuses a run before it starts. It was 3 until
# 2026-10-20, when a single day of runs left seven open decisions behind — each a question worth asking, none
# of them answered yet — and the next run would have refused to start for a reason that is the owner's backlog
# rather than a fault of the run. A run that keeps working while decisions accumulate is the point: the pile is
# read by `tools/issues/decisions.sh`, not by refusing to work.
# How many review rounds one item gets. The budget is a recorded value like every other one: a project that
# reviews harder raises it here rather than editing the phase (issue #187).
LOOP_MAX_REVIEW_ROUNDS_DEFAULT=2
# The floor below which the remaining time cannot pay for the next item, and the LOWER BOUND of the floor
# `next` derives: the run measures what its items cost (`done --wall`), so `next` takes the median of the
# finished items' wall times, multiplies it by the 1.5 spread the measurements show, rounds it up, and
# never goes below this value. The constant therefore decides a run with no history or with a cheap one
# (a run of skips), and a refusal names both numbers it compared (issue #206). Measured: 40-65 min for a
# change, 10-15 min for a gated-out skip, 100 min for #126 — `.pi/skills/fix-loop/REFERENCE.md`, "Measured
# costs".
LOOP_ITEM_FLOOR_MINUTES=45
# How long one child process may run before the run ends it, in seconds (2700 = 45 min). `--minutes` bounds
# the run; this bounds one child inside it, and it is a recorded value for the same reason the others are —
# it is a fact about the host, not about a phase. Measured 2026-10-19: one item's worker phase ran 83 min
# inside a single wait, and the run's deadline, which is consulted only between items, never fired. A child
# that outlasts this is ended with everything it started, its report carries `LOOP-TIMEOUT: …`, and the item
# is recorded `blocked` with that transcript rather than spent (issue #203).
LOOP_CHILD_MAX_SECONDS=2700
# The floor below which this host may not start an item, in MiB of available memory (`MemAvailable`, read from the
# file `LOOP_MEMINFO_PATH` names). Below it the item is recorded `blocked` with the measurement and the floor it
# was compared against, and the run stops: a run on a starved host cannot become productive by taking the next
# item. Measured 2026-10-19 (issue #209): item #126's gate hit **194 MB free RAM and 18 GB swap** and spent 30 min
# inside `:app:kspMobileDebugUnitTestKotlin`; the same 5 680 tests took **3m47s** on a quiet host. Measured on the
# same host during a run: 15 668 MB total, 13 168 MB used, **467 MB free**, 2 499 MB available, swap 13 915 MB of
# 37 887 MB — Firefox 7 600 MB, VS Code's Java language server 2 282 MB across three JVMs, Gradle/Kotlin daemons
# 1 625 MB, VS Code UI 885 MB, `cpptools` 407 MB, and the loop's own children 649 MB. The loop was the smallest
# consumer and the one that failed, and its `wallSeconds` measured the desktop session. 1024 MiB is the floor
# because a Gradle gate plus its daemons needs more than that to finish inside `LOOP_CHILD_MAX_SECONDS`. `0`
# disables the check.
LOOP_MIN_FREE_MIB=1024
# Where this host publishes the memory it has available: `MemAvailable:` in this file, in kB, divided to MiB and
# compared against `LOOP_MIN_FREE_MIB` before an item's first child is started. A host that has no such file — a
# container without procfs, or a platform that keeps the number elsewhere — makes the check pass, because a check
# that cannot be made is not a refusal and the engine must run there too. Empty is the same as an absent file.
# The key exists so the self-test can point the reading at a file of its own, and so a host that publishes the
# number somewhere else records it here rather than in a phase.
LOOP_MEMINFO_PATH="/proc/meminfo"

# Where `state.sh init` keeps the state it replaces, so a finished run's counters, verdicts and stop reason
# survive the next run starting (issue #207). Empty means `runs/` beside the state file — derived from the
# state, so the engine still names no project path. A project that archives elsewhere records the directory
# here; a relative value is relative to the project root. Archives are machine-local like the state itself:
# they live under `.pi/`, which is gitignored, and they are never committed.
LOOP_RUNS_DIR=""

# Where the loop's tooling puts throwaway trees. The self-test creates one `<prefix><random>` tree per suite
# under it, and `tools/loop/loop-clean.sh` reports and removes the ones a suite killed with `SIGKILL` left
# behind — a trapped signal is cleaned up by the suite itself, and `kill -9` cannot be trapped. Empty means
# `.pi/tmp` under the project root, which is gitignored; a relative value is relative to the project root.
# Measured 2026-10-20 (issue #210): 90 MB across four `loop-selftest.*` trees, every one of them from a suite
# that was killed.
LOOP_TMP_DIR=""
# How old a tree under `LOOP_TMP_DIR` must be before `loop-clean` treats it as left behind rather than as a
# suite that is writing into it right now. Only the age can tell the two apart — a killed suite leaves no
# lock that outlives it — so this is a host fact with a wide margin, recorded here and not in the engine.
LOOP_TMP_STALE_MINUTES=120

# ── the project-specific keys (D16) ───────────────────────────────────────────────────────

# How a child process is started — the ONE indirection through which every agent process is started
# (D3). A future sandbox change sets this to an `sbx exec …` invocation and touches nothing else.
#
# The value names *this project's* adapter with the agent as its argument, and the path is relative to the
# project root exactly as `LOOP_GATE_CMD` is (the run starts every child there). The adapter is outside the
# engine on purpose: it is where `--mode json` lives, so no script under `tools/loop/` names an agent command
# or a mode flag, and a second project points this key at its own adapter or at its own plain-text command.
# What the adapter does with the stream, and why the stream matters, is `tools/pi-child-events.sh`.
LOOP_AGENT_CMD="bash tools/pi-child-events.sh pi"

# Which of this project's skills the worker is told to use. The worker prompt skeleton carries a
# placeholder; these names are substituted into it at render time.
LOOP_WORKER_SKILLS="openspec-apply-change build-app run-tests revert-check"

# How this project's gate is run. Empty for a project with no build system: the phases still run and
# the report says the gate was skipped, because the gate is the project's, not the loop's. The invocation is
# the one this host completes: measured 2026-10-19, the same 5680 tests took **3m47s** through
# `-PforceTests --no-build-cache` and *never reached a suite* through `--rerun-tasks` (30 min inside
# `:app:kspMobileDebugUnitTestKotlin` at 194 MB free RAM and 18 GB swap). The flag table and the reason are
# `guidelines/Build.md` §4 and `.pi/skills/run-tests`; the gate is run **once** per item, and a gate that
# outlasts `LOOP_CHILD_MAX_SECONDS` blocks the item instead of being retried (issue #203).
LOOP_GATE_CMD="./tools/loop/gate.sh"

# The one command that answers what a change's pathspec owes and what numbers its evidence already carries — the
# worker is handed it as `{{MEASURE_CMD}}`, and it is a reading command: it runs no check, because the gate above
# is run once per item. Measured (issue #246, `.pi/issue-loop/items/{69,133,11,13,98}/events.jsonl`): an item
# spends 73 to 244 shell calls and 22 to 79 file reads, one model turn each, against 2 s to 575 s of tool time in
# 291 s to 1 644 s of wall clock — so the facts a worker needs before it plans belong to one call's output rather
# than to a walk of the tree. Empty for a project with no such command: the prompt then says so instead of naming
# a path that is not there.
LOOP_MEASURE_CMD="./tools/loop/measure.sh"

# The gate a delta owes is the one its pathspec asks for (issue #242): `./gradlew test` alone let a landing pass
# in the run and break `tools/check-portability-selftest.sh` in the pipeline, which reddened `main` on
# 2026-10-21. `gate.sh` reads the three keys below and runs what the change touches: the build's own gate when a
# compiled path changed, and the shell suite that covers the touched paths otherwise. `Build.md` §2 states the
# rule; these lines are this project's mapping of it, which is why they live in the profile and not in the engine.
LOOP_GATE_TALLY_DIR="app/build/test-results/loop-gate"
LOOP_GATE_COMPILED_CMD="./gradlew test -PforceTests --no-build-cache"
LOOP_GATE_COMPILED_PATTERNS="*.kt *.java *.kts *.gradle *.toml *.xml *.c *.cpp *.cc *.h *.hpp CMakeLists.txt app/src/main/cpp/* app/src/main/res/*"
# The classification pair is the project's own reading of the same rule, and it is here for the reason this key
# exists: an `openspec/` path — the delta a change writes, and the archive move that ships it — owes the gate that
# names an unclassified capability, and the tool's suite is what proves the gate reads both sets (issue #101).
LOOP_GATE_SUITES="tools/loop/*|tools/loop-selftest.sh;tools/loop-cases.sh|tools/loop-selftest.sh;tools/loop-mutations.sh|tools/loop-mutations-selftest.sh;tools/loop-mutations-selftest.sh|tools/loop-mutations-selftest.sh;tools/issues/*|tools/issue-tooling-selftest.sh;tools/tooling.json|tools/issue-tooling-selftest.sh;tools/issue-tooling-cases.sh|tools/issue-tooling-selftest.sh;tools/sensors/*|tools/sensor-selftest.sh;tools/sensor-*.sh|tools/sensor-selftest.sh;.github/workflows/sensors.yml|tools/sensor-selftest.sh;tools/check-portability*|tools/check-portability-selftest.sh;tools/portability-*|tools/check-portability-selftest.sh;tools/fixtures/foreign-project/*|tools/check-portability-selftest.sh;PORTING.md|tools/check-portability-selftest.sh;tools/check-action-runtimes*|tools/check-action-runtimes-selftest.sh;.github/workflows/*|tools/check-action-runtimes-selftest.sh;tools/gen-feature-list*.sh|tools/gen-feature-list-selftest.sh;tools/feature-list/*|tools/gen-feature-list-selftest.sh;openspec/*|bash tools/gen-feature-list.sh --check-classification;*.md|tools/check-doc-routes.sh;openspec/*|tools/check-doc-routes.sh;AGENTS.md|tools/check-doc-routes.sh"

# The one submodule a fresh worktree does not inherit, if the project has one. Empty for a project with
# none, and read only when the project carries a `.gitmodules` (D4): the path is the project's, not the
# loop's, and no script under `tools/loop/` names one.
LOOP_SUBMODULE_PATH="app/src/main/cpp/libosmscout"

# What a kept worktree keeps, and what it loses. The run keeps its worktree so the next run inherits a warm
# *checkout* — the sources and the git state — and not a warm *build*: the module build directories below
# are regenerated by the next build and read by no item, and removing them is what keeps the kept tree from
# growing by gigabytes per run (issue #210: 3.2 GB kept, of which 1.9 GB was `app/build`, on a root
# filesystem at 88 %). The list is this project's, so it lives here and never in a phase; a project with no
# build system records an empty value. `worktree.sh strip-scratch` removes exactly these, only inside
# `$LOOP_WORKTREE`, never following a symlink out of it and never touching a path git tracks, and
# `tools/loop/loop-clean.sh` reports and removes what a tree it was not asked to strip still carries.
LOOP_WORKTREE_SCRATCH_PATHS="app/build auto/build core/build buildSrc/build osmscout-client-java/build"

# What a review round's diff leaves out: one git pathspec, applied as an *exclusion* when the run writes
# `review-<round>.diff`, and named to the reviewer in its own prompt so the absence is never read as a missing
# artefact (issue #204). Empty for a project whose change records carry no generated tree, and then the diff is
# the whole change. Measured (issue #204): item #126's round-3 diff was 435 KB and 9 935 changed lines, of
# which 9 364 (94.3 %) were archived gate HTML and XML against 112 lines of Kotlin; re-measured on the run's own
# file, 10 883 lines with 9 574 of them inside `evidence/`. It excludes a directory tree and not an extension,
# because a `.txt` a reviewer must read can live outside it.
LOOP_REVIEW_EXCLUDE_PATHSPEC=":(exclude,glob)**/evidence/**"
