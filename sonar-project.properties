# The declared source boundary of the SonarQube Cloud analysis for `Framstag_NaviVeylin`.
#
# The scan that reads this file is `.github/workflows/sonar.yml`, which runs from `main` only. This file is
# the boundary: what the analysis measures as this repository's code is declared here rather than left to the
# scanner's default, because the default is wrong for this tree — `app/src/main/cpp/libosmscout` is a
# submodule checked out on disk (its own SonarQube Cloud project is `Framstag_libosmscout`), and
# `:osmscout-client-java` compiles the submodule's Java client API as its `vendored` source set.
#
# In scope: the Kotlin and Java this repository owns, one module each. Out of scope: the whole native tree
# (including this repository's own three C++ files — SonarCloud's C/C++ analysis needs a build wrapper or a
# compilation database, which this scan deliberately does not pay for, design D3), the vendored client API,
# the tooling and documentation trees, and every build output.
#
# The exclusion list below is a project-level property, and the scanner re-applies a project-level exclusion
# path at module level, so one declaration covers the module set.

sonar.projectKey=Framstag_NaviVeylin
sonar.organization=framstag
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# One module per Gradle module the build aggregates, each with its own base directory (the module name is the
# directory name), so a module-relative report path resolves inside that module (design D5).
sonar.modules=app,auto,core,buildSrc,osmscout-client-java

# ── what is measured ────────────────────────────────────────────────────────────────────────────────
# `src/main/java` carries the Kotlin sources of `app`, `auto` and `core` as well as their Java, which is why
# the source directory is named once per module and not split by language.
app.sonar.sources=src/main/java
app.sonar.tests=src/test/java
auto.sonar.sources=src/main/java
auto.sonar.tests=src/test/java
core.sonar.sources=src/main/java
core.sonar.tests=src/test/java
buildSrc.sonar.sources=src/main/kotlin
buildSrc.sonar.tests=src/test/kotlin
osmscout-client-java.sonar.sources=src/main/java
osmscout-client-java.sonar.tests=src/test/java

# SonarJava analyses bytecode as well as source, and the Kotlin analyzer needs the Java classpath for mixed
# files, so the classes of the one pure-Java module are named. The test step in the workflow compiles them
# before the scan runs (design D5).
osmscout-client-java.sonar.java.binaries=build/classes/java/main

# ── the boundary ────────────────────────────────────────────────────────────────────────────────────
# Six path groups and the generated-code patterns:
#   the native tree            app/src/main/cpp/**
#   the vendored client API    app/src/main/cpp/libosmscout/libosmscout-client-java/**
#   the tooling trees          tools/**, openspec/**, guidelines/**, licenses/**, vcpkg/**
#   the build outputs          **/build/**, **/.gradle/**, **/.cxx/**
#   generated code             BuildConfig, R/R$, Dagger/Hilt — the patterns the coverage reports filter too
sonar.exclusions=app/src/main/cpp/**,app/src/main/cpp/libosmscout/libosmscout-client-java/**,tools/**,openspec/**,guidelines/**,licenses/**,vcpkg/**,**/build/**,**/.gradle/**,**/.cxx/**,**/BuildConfig.*,**/R.java,**/R$*.java,**/dagger/hilt/**,**/Hilt_*,**/*_Hilt*,**/Dagger*Component*

# ── the coverage this build already measures ────────────────────────────────────────────────────────
# One report per module, each module-relative so it resolves inside its own base directory (design D4/D5).
# The root merged Kover report and the vendored JaCoCo report are deliberately absent: the merged report's
# paths land on the wrong file, and the vendored report measures the submodule.
app.sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
auto.sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
core.sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
osmscout-client-java.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
