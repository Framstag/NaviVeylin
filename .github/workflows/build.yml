name: Build Debug APK

# Build the debug APK on every change to the main branch and on pull
# requests targeting it. No secrets required — debug signing uses the
# auto-generated debug keystore and every dependency (Android SDK, NDK,
# vcpkg, libosmscout submodule) is public.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg is pinned so restored packages stay ABI-compatible (the ABI hash
  # includes the vcpkg tool version). Bump to a newer commit to refresh
  # ports — new ABI versions land in the GitHub Packages NuGet feed and
  # packages rebuild once, then self-heal.
  VCPKG_COMMIT: 94a541197763a4f449a1b91478df48c0584a6256
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Compiled vcpkg packages are cached as NuGet packages in the GitHub
  # Packages feed, each versioned by its ABI hash (restore matches per
  # package, so toolchain/runner-image changes rebuild once and the cache
  # self-heals). The old files provider + actions/cache keyed on the
  # manifest hash restored stale archives that vcpkg rejected and never
  # re-saved on a cache hit — a full rebuild on every run.
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/Framstag/index.json,readwrite
  VCPKG_NUGET_REPOSITORY: https://nuget.pkg.github.com/Framstag/index.json
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  # vcpkg must build deps with the SAME NDK as the app (ndkVersion in
  # app/build.gradle.kts) — the runner image pre-sets ANDROID_NDK_HOME to its
  # own NDK (27.3.x), which would otherwise produce mismatched deps.
  ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/27.0.12077973

jobs:
  build:
    name: Build debug APK (all ABIs)
    runs-on: ubuntu-latest
    # packages: write lets the GITHUB_TOKEN push/restore vcpkg binary
    # packages to the GitHub Packages NuGet feed; actions: write is needed
    # by the actions/cache entries for the Android SDK and Gradle caches.
    permissions:
      contents: read
      actions: write
      packages: write
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # AGP reads sdk.dir; setup-vcpkg.sh reads sdk.dir + org.gradle.java.home.
      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          org.gradle.java.home=$JAVA_HOME
          EOF

      # libosmscout must stay platform-independent: no Android logging
      # (android/log.h, __android_log_*, ANDROID_LOG_*) and no Android-only
      # CMake conditionals outside its frozen Android/ directory. The
      # Android/ dir itself is upstream-owned and never modified locally.
      - name: Check libosmscout Android-free outside Android/
        run: |
          set -euo pipefail
          if grep -rE --include='*.cpp' --include='*.h' --include='*.hpp' \
                --include='*.cc' --include='*.c' --include='CMakeLists.txt' \
                --include='*.cmake' \
                'android/log\.h|__android_|ANDROID_LOG|if\(ANDROID\)' \
                app/src/main/cpp/libosmscout \
                | grep -v '^app/src/main/cpp/libosmscout/Android/'; then
            echo "::error::Android-specific code in libosmscout outside Android/"
            exit 1
          fi
          echo "libosmscout is Android-free outside Android/."

      # ── Android SDK ──────────────────────────────────────────
      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api36-bt36-ndk27-cmake3221

      - name: Install Android SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # sdkmanager exits 0 after writing licenses; 'yes' then dies on the
          # closed pipe (SIGPIPE → 141). Under `set -o pipefail` that fails the
          # step — swallow it, sdkmanager's own exit code already ran.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      # Host build tools required by vcpkg host deps: gperf:x64-linux (used by
      # fontconfig) builds via autotools. Without these, fontconfig → cairo →
      # pango all fail and the .pc gate reports them missing.
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          # mono-complete: vcpkg's NuGet binary cache runs nuget.exe under
          # mono; ubuntu-24.04/latest runners no longer preinstall mono
          # (actions/runner-images#10636).
          sudo apt-get install -y autoconf autoconf-archive automake libtool mono-complete

      # ── vcpkg ────────────────────────────────────────────────
      - name: Clone vcpkg (pinned commit)
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD

      - name: Bootstrap vcpkg
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # vcpkg binary cache: built packages are stored as NuGet packages in
      # the GitHub Packages feed (nuget.pkg.github.com/Framstag), each
      # versioned by its ABI hash. A runner-image/toolchain update produces
      # new ABI versions — exactly one rebuild, then the cache self-heals;
      # dependency-list/overlay edits only rebuild the affected ports. The
      # token is written to the runner-local user NuGet config (outside the
      # checkout); the runner is ephemeral and destroyed after the job.
      - name: Configure NuGet source for vcpkg binary cache
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUGET_EXE=$("$VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)
          mono "$NUGET_EXE" sources add \
            -ConfigFile "$HOME/.config/NuGet/NuGet.Config" \
            -Source "https://nuget.pkg.github.com/Framstag/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "Framstag" \
            -Password "$NUGET_TOKEN"
          mono "$NUGET_EXE" setapikey "$NUGET_TOKEN" \
            -ConfigFile "$HOME/.config/NuGet/NuGet.Config" \
            -Source "https://nuget.pkg.github.com/Framstag/index.json"

      # Installs all deps for the 3 Android triplets; compiled packages
      # come from / are stored in the NuGet binary cache.
      - name: Install vcpkg dependencies
        run: ./setup-vcpkg.sh

      # setup-vcpkg.sh tolerates per-package failures (|| echo) — fail the
      # job here if any required package is actually missing.
      - name: Verify vcpkg packages
        run: |
          set -euo pipefail
          for pc in cairo marisa pango harfbuzz fribidi libpng freetype2 fontconfig protobuf libxml-2.0 zlib; do
            found=false
            for t in arm64-android arm-neon-android x64-android; do
              if [ -f "$VCPKG_ROOT/installed/$t/lib/pkgconfig/$pc.pc" ]; then
                found=true
              fi
            done
            if [ "$found" != true ]; then
              echo "::error::Missing vcpkg package: $pc"
              exit 1
            fi
          done
          echo "All vcpkg packages present for all triplets."

      # ── Gradle build ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # gradle.properties commits a machine-local JDK path
      # (org.gradle.java.home=/usr/lib/jvm/java-17-openjdk) which does not
      # exist on the runner — override it with the JDK set up above.
      - name: Build debug APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleMobileDebug

      # Unit tests across all modules (app mobile + automotive, auto, core,
      # osmscout-client-java). Runs on the host JVM via the JNI stub — no
      # device/emulator needed. Catches test-source breakage that the APK
      # build alone misses (e.g. fakes drifting from OSMScoutClient API).
      - name: Run unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" test

      # Code coverage (report-only, no gate): root Kover tasks merge
      # app/auto/core unit-test coverage into one HTML+XML report; the
      # pure-Java osmscout-client-java module is measured by its own JaCoCo
      # report. See guidelines/Build.md → Code coverage.
      - name: Generate coverage reports
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :koverHtmlReport :koverXmlReport :osmscout-client-java:jacocoTestReport

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: |
            build/reports/kover/**
            osmscout-client-java/build/reports/jacoco/test/**
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: naviveylin-debug-apk
          path: app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error
