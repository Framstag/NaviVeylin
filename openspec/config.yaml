schema: spec-driven

context: |
  Project: NaviVeylin — Android navigation app built on libosmscout
  Tech Stack: Kotlin, Java, C++20 (NDK)
  UI: Jetpack Compose + Material 3
  DI: Hilt
  Persistence: JSON files (JNI favorites, settings, search history)
  Navigation: Jetpack Navigation Compose
  Native: libosmscout-client-java via NDK/CMake
  Build: Gradle (Kotlin DSL), AGP 8.7+, CMake 3.22+
  Min SDK: 29, Target SDK: 36
  ABI Targets: arm64-v8a, armeabi-v7a, x86_64
  Android Auto: implemented (Car App Library, :auto module + NaviVeylinCarAppService, AAOS support)
  Distribution: Google Play (mobile + Android Automotive OS tracks, same applicationId); sideloading also supported
  External Repo: https://github.com/Framstag/libosmscout
  Guidelines: guidelines/Design.md, UI.md, MapRendering.md, Build.md, Regulatory.md, Logging.md — read the section that owns your topic, not the whole document. A whole-document read is expensive (Build.md ~29k tokens, MapRendering.md ~23k, UI.md ~22k, Design.md ~15k, Regulatory.md ~7k, Logging.md ~2k); AGENTS.md "Documentation Map" is the topic-to-section routing table, and `grep -n '^## ' guidelines/<file>.md` lists every section of one file.
  Native purity: libosmscout stays Android-free outside its frozen Android/ dir (CI-gated)
  Google Play Services: optional, used when available (Fused location, car MapController); no hard dependency — replaceable by design (e.g., LocationManager fallback)
  Tooling: do NOT use python3 for openspec interaction or CLI output processing — use plain shell, jq, or openspec's own --json output instead
  Defect-shaped items: `.pi/skills/fix-loop` owns the budgeted loop that closes bugs and defect-shaped improvements (triage → root cause proven by a test that is red on HEAD → `fix-*` change → apply → independent review → archive → TODO.md bookkeeping). An item may only enter that loop when exactly one fix follows from a proven root cause; otherwise it is skipped, not guessed at.

rules:
  proposal:
    - Each capability must be concrete enough to derive specs from — avoid vague names
    - List affected files and modules explicitly in the Impact section
    - Reference Android-specific components (modules, manifests, resources)
    - If you are unsure, ask!
    - If requirements do not seem to be complete, ask!
    - If decisions have to be made that have large consequence. Name options an consequence and ask!
    - Name the previous specifications that will be changed by the new proposal
    - Reference the guidelines/ document(s) affected (UI.md, MapRendering.md, Design.md)
    - State whether the change is additive or breaking, and the rollback path
    - "For native/JNI changes, state: submodule patch (minimal, upstreamable) or local override in the bridge module"
    - Assure that scope is clear. Is this a general feature, a feature only for the android auto integration or only for phone
    - "For a fix-* bug-fix change: state the root cause and its evidence (failing test name plus XML tally on HEAD, file:line, or a repro command) under Why; name the single resulting fix and the spec requirement the defect contradicts. If two fixes are defensible, the entry is not loop-eligible — say so instead of choosing silently."

  specs:
    - Write acceptance criteria in WHEN/THEN format
    - Every requirement must have at least one scenario
    - Scenarios must be testable — no "system should work" scenarios
    - Specs define the contract, not the implementation — avoid prescribing how
    - Reference Android framework APIs where relevant (e.g., LocationManager, CarAppService)
    - "For features affecting both phone and AA: state the parity requirement (same labels/hierarchy) or the platform constraint forcing deviation"
    - If a spec contradicts a guidelines/ doc, update the guideline in the same change
    - Include performance requirements where relevant (frame budget, allocation-free hot paths)
    - "For a fix-* bug-fix change: the delta touches only the requirement the defect contradicts (ADDED/MODIFIED, never a rewrite of unrelated text), and every scenario names the one test case that exercises it."

  design:
    - Document at least 2 alternatives per decision with rationale for the chosen one
    - "Bug-fix exception (fix-* changes): the alternatives are the ones the root-cause evidence eliminated — name each and why it is impossible. A list of viable options means the root cause is not established; stop and re-diagnose instead of writing the design."
    - Reference specific files, modules, and Gradle configurations that will change
    - Include risk assessment per approach
    - State the threading model (dispatcher, main vs background) and lifecycle handling per new component — see guidelines/Design.md §4
    - "Describe verification: unit tests + on-device checks (logcat, GPX replay where relevant)"
    - For any visual requirement, name the *measurement* that will settle it on device (coordinate-free diagnostics line, UI-dump geometry, `tools/measure-highlight.py` verdict) — "verify visually" is not a verification
    - Follow the design principles in guidelines/Design.md — architecture, state management, threading, native boundary, rendering, Android Auto, and build conventions

  tasks:
    - Each task must reference its parent spec
    - Always include tasks that verify the build compiles without errors
    - Always include tasks that verify existing tests still pass
    - Always include explicit tasks for creating new unit tests when new code is added (unless testing is not feasible)
    - Order tasks by dependency — what must be done first
    - Each task should be completable in one session — if too big, split it
    - Group related tasks under numbered headings
    - When a change supersedes a guideline, include a task to update the guidelines/ document
    - Include on-device verification tasks for UI, rendering, and Auto changes (emulator/head unit, surface lifecycle)
    - Include Gradle sync or build verification steps for Android-specific tasks
    - Every new invariant, bound, predicate or refusal path needs one revert-check task — name the single mutation and the case that must fail, restore, then re-run green forced with `-PforceTests --no-build-cache` (`--rerun-tasks` only when the change touched more than the test sources; the gate's own rule is `guidelines/Build.md` §2/§4); the `revert-check` skill holds the discipline and the evidence format
    - "For a fix-* bug-fix change the first task writes the test that reproduces the defect and records its red-on-HEAD run (case name plus XML tests/failures); the fix task then makes it green. A revert-check is added only for an invariant the fix introduces beyond the original symptom."
    - State each task's verification in the task itself (a test, command, observable behavior or delivered artifact), not in a separate late testing group
    - For a visual or observable-behaviour requirement, include a task that records the on-device measurement (diagnostics line output, UI-dump geometry, or the `pixel-check` verdict) with its numbers
    - For a UI/rendering change, include one task that measures the *pixels* (screenshot + `pixel-check`) for the claimed property, and say so when the property cannot be produced on a stationary emulator
    - "Enumerate every delta scenario and name the test case (or the device step) that exercises it — scenario to *case*, not just scenario to task; a WHEN/THEN can otherwise stay unenforced behind a green suite for months"
    - "For a requirement that names both surfaces, provide one case per named surface (phone case + car case), or an explicit host-substitute note when a surface is device-gated: one requirement proven once must not read as proven for both"

operations:
  apply:
    guidance:
      - Use the build-app, run-tests, and release-build skills (see guidelines/Build.md) for all build/test/release verification — they wrap the Gradle calls, stream output to the console, and evaluate return codes and build output
      - Before marking implementation complete, run the build and verify it compiles without errors
      - Before marking implementation complete, verify tests exist for all new/modified code and they pass
      - If build or tests fail, do NOT mark tasks complete — report failures and fix them first
      - Make sure that tests cover all relevant data combinations and process variants and thus cover the complete code under tests in all its variants
      - Make sure that the build has no warnings
      - Build only the targets needed for testing to minimize resource usage and compilation time
      - Verify all new/modified code against the guideline sections that own the conventions the change touches (`AGENTS.md` "Documentation Map" routes a kind of change to them, and `grep -n '^## ' guidelines/<file>.md` lists one file's sections) — a whole-document read is not required
      - Update README.md and AGENTS.md and other documentation if information stored there changed
      - Verify no regressions in unrelated areas
      - For native C++ changes, verify all target ABIs compile
      - Any problems you detect during implementation that are not initiated by this change, have to be documented in a TODO.md for later processing in other changes.
      - Suggest at the end of the development implementation of skills for repetitive work you have done
      - Log all solutions approaches that failed with a short log and problem description together with a time stamp in a "ki_processing_failures.log"
      - When starting feature development, check "ki_processing_failures.log" to avoid doing the same error twice.
      - For Android Auto changes, verify on emulator/head unit (surface lifecycle, host template constraints)
      - If user points to bugs in your code always question yourself, why did I not find it myself, which test was missing and add thee tests.
      - "MEASURE FIRST: never change projection/fit/layout code to fix a symptom described in pixels. Add a coordinate-free diagnostics line (numbers, never coordinates), read it on the device, and measure screenshots with the pixel-check skill before touching the code."
      - Iterate with focused test suites (`--tests "com.naviveylin.ui.<area>.*"`); run the full both-flavor gate once, before marking the change complete. Use the device-check skill for device runs instead of writing a new ad-hoc script per finding.
      - When a finding needs the owner's observation, ask 2-4 independent questions in ONE ask_user call (where/when/whether), not one question per round.
      - "When a fix cannot be verified by measurement (e.g. a stationary emulator cannot produce follow drift), say so explicitly in the task and the report instead of implying device proof."
      - Generate test coverage report and make sure that essential business logic and strategical gluing and integration code has a high test coverage
      - "In the fix-loop (`.pi/skills/fix-loop`), reproduce the defect — or, for a defect-shaped improvement, the missing bound — with a test that fails on HEAD before changing production code, and have a fresh read-only child confirm each spec scenario against the diff and the gate XMLs before archiving — the writer may not be the reviewer."


  # Verify gates (validation + review): openspec 1.10.0 loads guidance only
  # for 'apply' and 'archive' operations — there is no 'verify' operation.
  # The verify-change skill reads no config guidance, so these load during
  # archive (finalize/verify step) instead.
  archive:
    guidance:
      - Make sure that all spec scenarios are traceable to a task
      - Make sure that all tasks are traceable to a spec requirement
      - Make sure that no task references a deleted or renamed spec
      - Make sure that for every feature there are enough tests — especially unit tests
      - Make sure that style guides of the Android platform and Material Design 3 are followed
      - Verify design decisions follow the guideline sections that own them (`AGENTS.md` "Documentation Map" routes by kind of change); if a change supersedes a principle, update the affected section in the same change
      - Make sure no dead code remains and specs match the implemented behavior
      - For features in both variants, verify label/hierarchy parity (guidelines/UI.md)
      - Make sure that build and tests are green
      - Build compiles without errors for all target ABIs
      - All existing tests still pass
      - New unit tests exist for all new or modified code (unless testing is not feasible)
      - Every new public API has documentation (Kotlin docs or KDoc)
      - No hardcoded paths, API keys, or magic numbers
      - Error messages are user-actionable
      - Native/JNI code follows Android NDK conventions (no leaks, proper JNI exception handling)
      - Compose previews exist for new UI components
      - "A fix-* change archives only when the independent review reported PASS per scenario (or the failure is recorded and the change is left unarchived), the red-on-HEAD case and the green gate run are both quoted with their timestamps, and the TODO.md entry moved to fixed-by the archived change."
