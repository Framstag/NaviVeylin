name: Sensors

# The sensor pipeline: a file of its own, so the pipeline that validates changes never carries the
# credential that writes to the tracker and cannot be influenced by a contributor's code. Its triggers are
# capped at two kinds — a schedule and an explicit dispatch — and it has no path that runs near a change
# under review.
#
# The schedule is on. The rows' inputs are published by the build pipeline as the artifact
# `sensor-inputs` (`tools/build-inputs.sh`), and this pipeline fetches the record for the commit it examines
# before it selects a row (`tools/fetch-build-inputs.sh`) — a commit whose build has not finished yet is a
# skipped run, not four failed checks. The tick's minutes must cover every minute the registry's rows
# declare, which `workflow#tickMinutesCoverTheRegistryCrons` asserts.
#
# `schedule` only fires from the default branch; a dispatch can select any ref, so the first step is a
# runtime guard rather than a line of YAML to be trusted (design D1, D3).
on:
  schedule:
    # Matches the registry's declared minutes (0 and 30), so every row's cadence is hit by some tick.
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the tracker (default: decide only; a scheduled run always writes)"
        type: boolean
        default: false

# Read-only by default; the job below raises `issues: write` for itself and nothing else.
permissions:
  contents: read

# Two runs can never race to file, reopen or close the same issue.
concurrency:
  group: sensors-main
  cancel-in-progress: false

jobs:
  sensors:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The record itself is read from the build pipeline's artifact of this commit — the workflow's own
      # ephemeral token, never the tracker token, and read-only. The tracker writes are the repository
      # secret's, whose scope is `guidelines/Backlog.md` §9: Issues read and write, Pull requests read.
      actions: read
      issues: write
    # A scheduled run writes: nobody dispatches it, so a dry run would measure for nobody. A dispatch keeps
    # its explicit choice and still defaults to a dry run. `inputs.apply` is compared as the boolean it is
    # declared to be — `== 'true'` is never true for a `type: boolean` input (GitHub coerces the boolean to a
    # number and the string to NaN), which would silently turn every dispatch into a dry run.
    env:
      SENSORS_MODE: ${{ (github.event_name == 'schedule' || inputs.apply == true) && '--apply' || '--dry-run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The guard compares HEAD with the remote main branch's commit, so that ref has to exist. Fetched
      # by name rather than by the dispatched ref, so a run against a branch still compares against main.
      - name: Fetch the main branch the guard compares against
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # Before any sensor: on the main branch, HEAD equal to the remote main branch, a clean tree, an
      # allowlisted identity and a complete registry. A refusal here writes nothing. The remote it compares
      # against defaults to `origin`, which is what this checkout produces; a checkout that names its remote
      # differently passes `--remote <name>` or sets `SENSORS_REMOTE`.
      - name: Guard the run
        env:
          GH_TOKEN: ${{ secrets.SENSORS_TOKEN }}
        run: bash tools/sensors/guard.sh --ref "$GITHUB_REF"

      # The record the rows read: of the commit this run examines, downloaded by the workflow's own token
      # from the build pipeline's artifact, with the conclusion the build's run ended with reported beside it.
      # `ready=false` (exit 3) means the build has not finished yet — a skipped run that writes nothing and
      # reports no failed check, rather than four `error` rows.
      - name: Fetch this commit's build record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash tools/fetch-build-inputs.sh --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --dest . \
               --conclusion-file "$RUNNER_TEMP/build-conclusion"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "conclusion=$(cat "$RUNNER_TEMP/build-conclusion")" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 3 ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

      # The labels the checks file under are declared by the registry (`sensor/<id>`) and by the profile,
      # so they are created from that declaration before anything files: a filing under a label the tracker
      # does not carry would fail. Re-running is a no-op. Gated on the record like the rows: a run with
      # nothing to measure writes nothing at all (spec `backlog-sensors`, "no record yet … nothing is written").
      - name: Create the declared labels
        if: steps.record.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SENSORS_TOKEN }}
        run: bash tools/issues/labels.sh --apply

      # The repair, before the rows: it makes an authorised item workable again by writing the full tracked
      # path of a citation whose target the tree does hold, and parking what nothing accounts for — with the
      # attempts recorded, so the item leaves the eligible queue visibly instead of being re-excluded every run
      # (`stale-citation-resolution` D4/D5/D6). Bounded, and idempotent: a canonical citation is `exact`, a
      # parked item is skipped, so a second run posts nothing.
      - name: Repair the stale citations
        if: steps.record.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SENSORS_TOKEN }}
        run: bash tools/issues/resolve-stale.sh "$SENSORS_MODE" --max-items 25

      # The identity is a repository-scoped token, never the workflow's own: the tracker's gate requires
      # an allowlisted author, and the token's scope is the one `guidelines/Backlog.md` §9 states — Issues
      # read and write, plus Pull requests read for the row that lists pull requests.
      #
      # The rows are run in two steps, because a red build's record is partial by construction: it cannot
      # carry the coverage summary, the package or the timing record, so the rows that *measure the build*
      # are attempted for a record a build completed successfully and for nothing else — otherwise every one
      # of them would report a failed check and the run would be red four times a day for a reason that says
      # nothing about the checks (issue #168).
      - name: Run the rows that measure the build
        if: steps.record.outputs.ready == 'true' && steps.record.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.SENSORS_TOKEN }}
        run: bash tools/sensors/run.sh --due --rows build-duration,package-size,coverage "$SENSORS_MODE"

      # Every other row runs for any record, none of them reading an output a red build cannot produce:
      # `broken-main` reads the result record the publisher always writes, `pr-conflicts` the API, `hotspot`
      # the repository's history and `stale-citations` the tracker. This is also the half that keeps a red
      # build visible as exactly one row's verdict.
      - name: Run the condition rows and the repository rows
        if: steps.record.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SENSORS_TOKEN }}
        run: bash tools/sensors/run.sh --due --rows broken-main,pr-conflicts,hotspot,stale-citations "$SENSORS_MODE"

      - name: Report the rows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SENSORS_TOKEN }}
        run: bash tools/sensors/report.sh
