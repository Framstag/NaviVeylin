# tools/loop/loop.conf — the loop's recorded run defaults, and the three keys that are this project's.
#
# The loop's engine is portable: the queue, the worktree, the phases, the gate discipline, the stop
# conditions and the report name no skill, no command and no project value. Everything that IS this
# project's lives here, and nowhere else (design D16). A second project edits this file and
# `tools/tooling.json`; it never edits a phase or a prompt skeleton. Which value of the profile's
# namespaces each of the loop's decisions means lives in the profile's `roles` section, read through
# `lib.sh`'s `loop_role` and enforced by the portability check.
#
# Sourced by `tools/loop/lib.sh` (and through it by every script and prompt renderer). Override the
# whole file with `LOOP_CONF=<path>`, which is what the loop self-test does to prove the seam.

# ── the budget defaults (D2) ─────────────────────────────────────────────────────────────────────
# Every flag `run.sh` accepts is recorded here, and an omitted flag takes this value: a script cannot
# ask, so the budget is a file plus arguments rather than a dialogue.
LOOP_ITEMS_DEFAULT=3
LOOP_MINUTES_DEFAULT=90
LOOP_REVIEW_DEFAULT=on
LOOP_MAY_CLOSE_DEFAULT=yes
LOOP_MAX_DECISIONS_DEFAULT=10
# The ceiling of open `agent/needs-decision` items that refuses a run before it starts. It was 3 until
# 2026-10-20, when a single day of runs left seven open decisions behind — each a question worth asking, none
# of them answered yet — and the next run would have refused to start for a reason that is the owner's backlog
# rather than a fault of the run. A run that keeps working while decisions accumulate is the point: the pile is
# read by `tools/issues/decisions.sh`, not by refusing to work.
# How many review rounds one item gets. The budget is a recorded value like every other one: a project that
# reviews harder raises it here rather than editing the phase (issue #187).
LOOP_MAX_REVIEW_ROUNDS_DEFAULT=2
# Whether the diff is reviewed **before** the item's gate, by a fresh reader, whose findings a fresh gate child
# applies in one pass (issue #758). `on` is the shape this project runs: the change child's session ends at the diff,
# the reviewer reads that diff, and the gate child then runs the item's one gate. `off` keeps the older shape — one
# child from the diagnosis to the gate — and is folded to `off` by `run.sh` whenever `--review off`, because the split
# exists for that reading and a run with no reviewer has none to place in front of the gate.
#
# Measured on this loop's archive (`python3 tools/loop-spend.py --json`, 2026-11-03, 227 items, 2 591 Mtok): **1 581
# Mtok — 61 % — is spent after the item's first gate**, and 117 child sessions ran the gate three times or more. The
# reviewer is not what costs that (7 522 turns at 53.6 k tokens each against the worker's 84.5 k at 25 654 turns): a
# finding that could have been made from the diff alone is paid for twice — once by the gate it did not need and once
# by the full pass the rework that answers it then makes. Moving the cheap judgement in front of the expensive
# verification does not reduce how many rounds an item takes; it reduces what a round costs.
#
# The round before the gate is **not** a round of `LOOP_MAX_REVIEW_ROUNDS_DEFAULT`: it refuses nothing, it never
# blocks, and its report stays in the item's directory. The round the budget bounds is the one after the gate.
LOOP_PRE_GATE_REVIEW_DEFAULT=on
# Whether a difference in the project's own tree decides an item. `off` records it — the paths that changed and
# the processes standing in the project but outside the worktree — and lets the item keep the outcome its work
# earned; `on` blocks the item (and discards the review round) as the loop did until 2026-10-23. It is `off`
# because the comparison measures a tree the run does not own: 5 of 139 items across four runs were blocked by it,
# and in the three cases of 2026-10-23 (#274, #276, #285) the child had written nothing there — every write target
# in the three transcripts lay under `.pi/worktrees/loop/` or the item's evidence directory. The run's own
# landings fast-forward the base in the project tree (`worktree.sh merge-item`), and a peer session writes it too,
# so two readings of it are not evidence about one child. Turn it on for a tree that is exclusive.
LOOP_STRICT_OUTSIDE_WRITE_DEFAULT=off
# The floor below which the remaining time cannot pay for the next item. The run measures what its items cost
# (`done --wall`), so `next` takes the **cheapest** finished item's wall time, multiplies it by the 1.5 spread
# the measurements show and rounds it up. That value is the floor; this key is the whole floor only of a run
# with no measurement, and it is no longer a lower bound of a derived one (issue #674) — held below for every
# history it made a run of 10-15 min skips stop up to ~50 min before its deadline, the "one constant for every
# item" defect the child's bound was cured of, one level down. A refusal names the cheapest wall time, the count
# of finished items it came from and this value.
# It is 65 min and not 45 because it is the floor a run with *no history* refuses by, and such a run owes what one
# item's gate owes (`LOOP_ITEM_GATE_SECONDS`, 3 900 s = 65 min): an item started with the floor's minutes left could
# pay for its gate and lose the phases after a green round — the loss the child's bound no longer takes, through the
# other door (issue #663, review of the first round). A project with no gate owes nothing by this key and keeps 45.
# The cost it accepts: a derived floor can sit below what a gated item owes, so a gated item started in a cheap tail
# is cut at the run's own deadline and left for the next run with its work kept — bounded at one item per run,
# because the deadline ends that child and the run stops right after it. The cut item is not escalated as a decision
# (`run#childIsEndedAtTheRunsDeadline`), and its patch is recorded in the item's state and named by the report.
# Measured: 40-65 min for a change, 10-15 min for a gated-out skip, 100 min for #126 — `guidelines/Backlog.md` §7,
# "What an item costs", carries the measurements and the derivation.
LOOP_ITEM_FLOOR_MINUTES=65
# How many consecutive refusals a run stops on (issue #804). A refusal predicts the next item's failure — the same
# gate, the same provider, the same tree — and the engine answered that with a pair, which is the shortest evidence
# a prediction can rest on: measured 2026-11-05 and 2026-11-06, eight of twelve runs stopped on the pair with 55–90 %
# of their budget unused (2026-11-05 04:28: 105 of 720 min used, 1 item closed; 07:49: 60 of 720, none; 2026-11-06
# 05:16: 65 of 600, one) — those hours were the run's clock, not the work's. The count is recorded here and not in the
# engine, so a project can raise it against a flaky provider and lower it against a broken tree; `2` is what a project
# that records nothing keeps, which is the value this engine shipped with.
# What it costs: the streak is the run's only brake that is not a clock, so four refusals cost up to four items'
# budget before the run stops. A run shorter than four item budgets is ended by its deadline first — 4 x 65 min is
# more than a 240-minute run holds — so this key matters for the long runs, and a short run's protection is
# `--minutes`.
LOOP_REFUSAL_STREAK_STOP=4
# How many times a run re-starts an item whose child failed a **transient** class before it stops, and how long
# it waits before each (issue #752). Every stop the run has is a statement about an item or the queue, and the run
# read it as one about the window: measured over the 86 archived runs in `.pi/issue-loop/`, 9 ended on two
# consecutive blocked items (3 of them on items that failed in 3-19 s), 9 on `worktree is not clean` (4 within
# 4 minutes of starting), and 3 on `gh could not read #N` — and the first attempt of the night of 2026-11-01->02
# stopped 125 s into a 360-minute budget when a provider that refused every call left #739 and #740 `blocked`. A
# retry is a recorded value like every other bound: `LOOP_RETRY_MAX` is the cap and `LOOP_RETRY_DELAYS` is one
# delay per retry, spent on a class once per run, so a deterministic refusal is not re-asked forever and a class
# that fails the cap is an answer about the run. `LOOP_RETRY_MAX=0` is a project that records no retry. The run's
# own `state.sh` stops (item cap, deadline, empty queue, the floor) stay final: they are verdicts about the run's
# budget, not failures. The class this tree spends the budget on is the child that never started (`tools/loop/run.sh`,
# §7d of `guidelines/Backlog.recipes.md`), and a project with no time to wait records the delays it can pay.
LOOP_RETRY_MAX=3
LOOP_RETRY_DELAYS="30 120 300"
# How long one child process may run before the run ends it, in seconds (2700 = 45 min). `--minutes` bounds
# the run; this bounds one child inside it, and it is a recorded value for the same reason the others are —
# it is a fact about the host, not about a phase. Measured 2026-10-19: one item's worker phase ran 83 min
# inside a single wait, and the run's deadline, which is consulted only between items, never fired. A child
# that outlasts this is ended with everything it started, its report carries `LOOP-TIMEOUT: …`, and the item
# is recorded `blocked` with that transcript rather than spent (issue #203).
#
# This value is the **floor** under a child, not the bound it is given: an item owes its own gate, and one gate
# round on this host costs more than 45 min allows beside the work the round is not (issue #663). Measured
# 2026-10-26 on #310, a `tools/loop/**` item: gate round 1 (red) 957 s, one focused falsification suite 233 s, gate
# round 2 (green) 972 s, and 542 s of reading the item, the edit, the evidence, the archive and the report — 2 704 s
# against the 2 700 s this key allowed, and the child was ended 8 s after its green `gate-summary.xml` was written.
# #664 and #666 ended the same way, each a change the run paid for and then discarded. `run.sh`'s `child_cap` gives
# a child the larger of this floor and `LOOP_ITEM_GATE_SECONDS` below.
LOOP_CHILD_MAX_SECONDS=2700
# How many turns **one child** may take before the run ends it, per role (issues #686, #784). The wall clock above
# bounds how long a child runs and says nothing about how much it spends being slow to converge, and a child is paid
# for per turn: `cacheRead` is 97 % of the archive's spend, a turn re-reads the whole conversation, and the archive
# records 1.05–1.16 tool calls per turn, so a heavy child is a chain of single-call turns at 85–106 k context each.
# The first version of this key (250) was the **item's** bound, counted over the one event stream every child of the
# item appends to, and that made the bound decide *which phase* was discarded rather than whether the item was
# converging: measured 2026-11-05 over the ten items that ran all five phases (`.pi/issue-loop/items`, one
# `turn_end` per turn per child, read by `evidence/role-census.py` in change `fix-role-turn-bounds`), #780 spent
# 80/34/42/41 turns on its worker, its
# round before the gate, its gate and its tail, and the round-1 reviewer was ended at 53 of the same 250; #767's
# round-2 worker was given three turns before the item's pot ended it; and six of that day's eight blocks were this
# bound. An item that closes now costs 192–241 of the old 250, so a fifth phase had no headroom at all.
#
# The bound is therefore **the child's own**, one key per role, read through `run.sh`'s `child_role` — a role is
# `worker`, `worker-gate`, `worker-tail`, `reviewer` or `reviewer-pre-gate`, and each key is
# `LOOP_CHILD_TURNS_MAX_<ROLE>` with the hyphen read as an underscore.
#
# **Where a stop bound sits.** It is a runaway bound, not a description of the work: it has to sit above the
# population it is applied to, or the loop's own bookkeeping becomes the run's leading stop reason. The first
# values of these five keys sat at the **p75 of a 12-item, twelve-session sample** and were measured on
# 2026-11-05, the first run that used them: three of six items had their worker ended at exactly 110 turns after
# 4.5–12 min, each leaving a 4–6 k-line patch behind (#788 `run.sh`+`loop-cases.sh`, #778 nine files, #759
# `report.sh`+`state.sh`), and the run stopped on "two consecutive items ended blocked" with 324 of its 480
# minutes, and 74 of its 80 items, unused. Re-read over the whole archive (`evidence/role-census.py` in change
# `fix-role-turn-bounds`, 245 items, 2026-11-06): **77 of 346 worker sessions — 22 % — sat at or over 110 turns**,
# which is what a p75 stop bound buys. A p75 of a censored sample is worse than that: the sessions the bound ended
# can never report the length they would have had, so the estimate is biased low.
#
# Each value below is therefore the archive's own **p95 or above**, per role, and above the observed maximum where
# the sample is too small to have a p95 worth quoting:
#
#   * worker 200 — p50 77.5, p75 104, p90 138.5, p95 161.8, p99 196.6, max 219 over 346 sessions: 200 sits above
#     that p99, so the bound ends roughly the last 1 % instead of the 3–5 % the 170 did (issue #804).
#   * worker-gate 100 — p50 37, p75 47.5, p90 67, p95 69, max 71 over 11 sessions. The old 60 sat **below**
#     sessions that finished (67–71), so it cut gates this archive shows converging. 80 was that maximum plus a
#     margin, and it was not enough: 2026-11-06, #790's gate child was ended at 80 turns after 22 min while the two
#     gates that finished that day used 44 and 48 (issue #804). 100 is 1.4x the observed maximum.
#   * worker-tail 65 — p50 27.5, p75 37.5, p90 43.4, p95 56.2, max 60 over 20 tails. The old 45 sat below three
#     observed tails for the same reason; 65 sits above the observed maximum and is left alone.
#   * reviewer 110 — p50 31, p75 40, p90 52.7, p95 57.7, p99 68, max 107 over 234 rounds. 75 sat **below** the
#     observed maximum, which is the one thing this passage says a stop bound must never do (issue #804).
#   * reviewer-pre-gate 110 — n=12, p50 40, p95 55, max 55, every session censored at the old bound of 55: the
#     sample is too small to justify a tighter number, so the role with no measurement of its own keeps the
#     review round's.
#
# The cost is accepted and stated: one worker that does run away now spends up to 200 turns (~21 Mtok at the
# measured 106 k tokens a turn) before the run ends it, and the token band (`LOOP_ITEM_TOKENS_WARN`) is what
# flags the item that got there. What the bound must never do is end the item that was working.
#
# It is a **stop**, not a warning, and it is counted from the stream the adapter writes: `tools/pi-child-events.sh`
# adds one `turn_end` line per turn to `items/<n>/events.jsonl`, `run.sh`'s `child_turns` counts them, and `run_child`
# — where the wall clock already ends a child — ends the one that reaches its role's bound together with everything
# it started. Its transcript then carries a `LOOP-TIMEOUT` line naming the bound, the role and the count, the tree it
# left is kept and not committed, and the item is recorded `blocked` with that line and `bound` as its mechanism —
# no decision label, no pair in the streak `state.sh next` stops a run on, and a note saying the attempt waits for
# the next run, exactly as the memory floor (`LOOP_MIN_FREE_MIB`) and the wall clock already block and no more. `0`,
# or a configuration that records no key at all, is no
# bound: a project that carries no such record owes nothing by it, and a runner that wants one role unbounded sets
# that key to `0` here rather than editing a phase (D16). The **item's** total is no longer a bound: it is still
# counted (`metrics.turns`, summed over its children) and reported (the report's `calls:` line beside
# `LOOP_ITEM_CALLS_PER_TURN_MIN`), the way `LOOP_ITEM_TOKENS_WARN` is a band and not a stop. What the keys do not
# replace are the levers that make an item finish under them — batching independent calls per turn, splitting a
# worker session at its first gate, `tools/loop/phase.sh` (#688) and `tools/look.sh` (#687).
LOOP_CHILD_TURNS_MAX_WORKER=200
LOOP_CHILD_TURNS_MAX_WORKER_GATE=100
LOOP_CHILD_TURNS_MAX_WORKER_TAIL=65
LOOP_CHILD_TURNS_MAX_REVIEWER=110
LOOP_CHILD_TURNS_MAX_REVIEWER_PRE_GATE=110
# The round a refusal buys (issue #821). It was charged to the worker's key until the rework round became a role of its
# own, and the worker's 200 is another population's bound: over the archive, the 109 rework sessions this project has
# run take 11 turns at the least, 60 at the median and 100 at the p95, so 100 was the value this role's p95 gave it
# (measured 2026-11-07, `jq`/`awk` over every item's `events.jsonl`; the command and its output are the evidence of the
# change that added the key).
#
# 150 is a **measured experiment** and not a second p95 (issue #842). The run started 2026-11-09T21:42:41Z cut seven
# items: six at or just past `LOOP_ITEM_CONTEXT_MAX` — 200 949, 201 500, 201 545, 202 253, 202 372, 202 961, 0.5 % to
# 1.5 % over — and one, #831, at 199 178, 0.4 % **under** it, ended by this key after 100 turns. A turn is priced at
# the context it re-reads, not at the item's all-phase average: that rework child averaged **105 511** tokens a turn
# over its last 100 turns (`turn_end` `input + cacheRead` on `.pi/issue-loop/items/831/events.jsonl`) and read
# **199 178** on its last one, so fifty more turns is **≈ 5.3–10.0 Mtok, 4.8–9.1 %** of the run's 109 847 773 — not
# the 4.1 Mtok / 3.7 % that item's blended average gives (16 252 700 / 198 = 82 084 a turn, a worker-and-gate rate
# charged to a rework turn).
#
# What the raise cannot be tested on is that item: #831 sat **822 tokens** under the 200 000 context stop while its
# context rose **2 592 tokens a turn** (last 20 turns: 147 345 → 199 178), so the context arm ends that child within
# about one more turn and no 150-turn bound ever applies to it. What this experiment reads is therefore a rework
# child that is **context-light** — one that reaches this bound with room left under the context stop — together with
# the cut items' overshoot and the share of the run's spend that falls after the first gate (78 % of 70.2 Mtok,
# 54.6 Mtok that run), because a larger bound buys more of the tail a cut is made of and is never an assumption that
# the item would land.
#
# The value is **provisional** until that reading exists. Until a run's cut items and its after-the-first-gate share
# have been read against the 2026-11-09 six-over/one-under split, the reading is a `tasks.md` item of the change that
# moved the key and not a fact of this configuration: a later reader who finds this figure unread owes that reading
# before defending it or reverting it.
#
# The counter-weight is #686: the 35 items past 250 turns held 878 of 1 982 Mtok — 44 % of the archive's spend — which
# is why this is one role's key and fifty turns rather than a general raise. The **context** bound is not raised beside
# it: `LOOP_ITEM_CONTEXT_MAX` stays 200 000, because #833 recorded that refusal beside it and #836 re-proposed
# 200 000 → 250 000 and was closed `NOT_PLANNED` (both in `guidelines/Backlog.recipes.md` §7b, the one place the
# refusal is recorded). This value costs turns inside the provider's window and nothing else.
LOOP_CHILD_TURNS_MAX_WORKER_REWORK=150
# What a turn costs, and the two bounds read from it (issue #760). The per-role turn bounds above count turns, and a
# turn is not a unit of cost: every turn re-reads the whole conversation, so the same count costs 40 k or 240 k
# depending on how far the context has grown, and the expensive items were therefore decided after they had been paid
# for. The reading that varies is the largest context a turn reported — `tools/loop/state.sh`'s `child_usage_json`
# takes it for the report, after the item is over — and the run now reads it while the child runs, from the usage
# records the child's own event stream carries. Measured over the 300 item records of `.pi/issue-loop/run.json` and
# `runs/*.json` (2026-11-05, `jq -r '.items[]?.metrics.context'` over both, one `sort -n | awk`): the largest context
# per item is p50 107 669, p75 143 124, p90 174 984, p95 191 815, maximum 244 764.
#
# `LOOP_ITEM_CONTEXT_WARN` is a **checkpoint, never a stop**: one `LOOP-CONTEXT:` line on the run's own output when
# the child crosses it, naming the reading and this value. It is the p75, recorded exactly as measured, the way
# `LOOP_ITEM_TOKENS_WARN` records its own: about one item in four is named, and the hardest items are among them —
# which is the point, because a session that could split at its gate is the cheaper half of the bound below it
# (`tools/loop/prompts/worker-tail.md` is the shape that split takes, and it is a separate change).
#
# `LOOP_ITEM_CONTEXT_MAX` is the **stop**: past it every further turn costs several times the first, and that is a
# decision, not a slower convergence. 200 000 sits above the p95 (191 815) and at the window every provider this
# project runs sits at, where a turn costs 1.86x the archive's median turn (200 000 / 107 669); 10 of the 300
# recorded items (3.3 %) reached it. The child is ended the way the wall clock and a role's turn bound end one — its
# transcript carries `LOOP-TIMEOUT: the child reached the recorded context bound of <n> tokens (LOOP_ITEM_CONTEXT_MAX)
# at <m> tokens`, its tree is kept and not committed, and the item is recorded `blocked` with that line and `bound`
# as its mechanism, so no decision label is written for it. `0`, or a configuration that records no key, is no bound
# for either: a project that carries no such record owes nothing by it, and it does not replace the per-role turn
# bounds, which still end a session that keeps batching badly at a small context.
LOOP_ITEM_CONTEXT_WARN=143124
LOOP_ITEM_CONTEXT_MAX=200000
# What one item's gate owes, in seconds (3900 = 65 min), which is the number a child's bound follows. Derived from
# the same measurement, on this host: one gate round cost 971 s over 23 suites, and an item owes a red round and a
# green one — 971 s times the 1.5 spread the item floor's derivation uses is 1 457 s, recorded as 1 500 s, so two
# rounds are 3 000 s; the work the rounds are not (the measured 542 s of reading, edit, evidence, archive and
# report) is recorded as 900 s. It is a fact about this project's gate, so it lives here and not in the engine
# (D16); a project with no build system leaves it out, and its children keep `LOOP_CHILD_MAX_SECONDS`. The
# measurements are `guidelines/Backlog.md` §7, "What an item costs" (issue #663).
LOOP_ITEM_GATE_SECONDS=3900
# The band one item's spend is read against, in tokens, and the line the report prints when an item is above it
# (issue #662). The report printed an item's tokens, its largest context and a run-level total and held no bound
# against any of them, so an item that cost twice what it used to read exactly like a healthy one: over the
# archive's runs the per-item median rose from 9.51 M to 18.30 M tokens in three days and no report said a word.
# The number is the archive's own p75, measured over the 164 items whose `metrics.tokens` a state records
# (`.pi/issue-loop/run.json` and the states `init` kept under `.pi/issue-loop/runs/`, read by the change's own
# `evidence/token-band.py`, which prints the `LOOP-BAND-*` lines):
# median 8 656 911, p75 16 858 818, p90 22 958 848, maximum 44 163 688, and p75 is 1.95x the median — which is
# where "twice what it used to" sits. p90 was rejected: at 2.65x the median it sits above most of the items of the
# run that was missed, whose per-item median had already risen to 18.30 M, so it could reproduce the defect it is
# meant to catch. The cost is stated: a healthy run flags about one item in four, and the hardest items are among
# them — which is the point, since a regression multiplies exactly those.
#
# It is a **warning, never a stop**. A bound that ended an item would trade a measurement for a refusal, and it
# would fire hardest on the items that were hardest to land; nothing in the run reads this key, and an item above
# it is worked, reviewed, gated and closed exactly as before. `0`, or a configuration that records no key at all,
# means no band: a project that carries no such record owes nothing by it, and a runner that wants the flag gone
# sets it here rather than editing a phase (D16). What the line prints is the item's recorded `metrics.tokens` (its
# input, output, cache read and cache write, `tools/loop/state.sh`); the analysis tool `tools/loop-spend.py`
# (skill `loop-spend`) stays what explains *why* an item cost what it did.
LOOP_ITEM_TOKENS_WARN=16858818
# The floor under one item's **calls per turn**, and the items the report's trend names below it (issue #757). The
# tokens above bound what an item cost; this bounds the shape it spent them in, which is the other half of the
# same cost: every turn re-reads the whole conversation, so a session that makes one tool call per turn pays the
# conversation again for every independent read it could have batched. Measured over `.pi/issue-loop/items` (227
# items, 2026-11-03, the same event streams `tools/loop-spend.py` reads): **36 825 `tool_execution_end` lines in
# 33 183 `turn_end` lines, 1.11 calls per turn**, at 78 k tokens a turn and 97 % cache read; per item the ratio is
# p10 0.99, p25 1.05, p50 1.11, p75 1.22, p90 1.32, maximum 1.61 — every item of the archive is under two calls a
# turn. 1.05 is the archive's **p25**, rounded to the two decimals a ratio is read at: it names the worst quarter
# of the items, which is the band the single-call chain sits in, in the direction the token band flags from the
# other side. A floor at p50 (1.11) was rejected because it flags half the archive, and a flag on half the items
# is a banner rather than a measurement — the argument that kept the token band off its own median and at the p75.
#
# It is a **warning, never a stop**, like the token band: nothing in the run reads this key, an item below it is
# worked, reviewed, gated and closed exactly as before, and `0` — or a configuration that records no key at all —
# prints the floor as off rather than as `none`. What the trend prints is the ratio of the two counts the item's
# state records (`metrics.calls`, `metrics.turns`, summed over its children by `tools/loop/state.sh`); the per-role
# turn bounds above (`LOOP_CHILD_TURNS_MAX_<ROLE>`) are the **stops** this bounds the shape of, and the levers that
# raise the ratio are the worker prompt's batching rule, `tools/look.sh` (#687) and `tools/loop/phase.sh` (#688).
LOOP_ITEM_CALLS_PER_TURN_MIN=1.05
# The floor below which this host may not start an item, in MiB of available memory (`MemAvailable`, read from the
# file `LOOP_MEMINFO_PATH` names). Below it the item is recorded `blocked` with the measurement and the floor it
# was compared against, and the run stops: a run on a starved host cannot become productive by taking the next
# item. Measured 2026-10-19 (issue #209): item #126's gate hit **194 MB free RAM and 18 GB swap** and spent 30 min
# inside `:app:kspMobileDebugUnitTestKotlin`; the same 5 680 tests took **3m47s** on a quiet host. Measured on the
# same host during a run: 15 668 MB total, 13 168 MB used, **467 MB free**, 2 499 MB available, swap 13 915 MB of
# 37 887 MB — Firefox 7 600 MB, VS Code's Java language server 2 282 MB across three JVMs, Gradle/Kotlin daemons
# 1 625 MB, VS Code UI 885 MB, `cpptools` 407 MB, and the loop's own children 649 MB. The loop was the smallest
# consumer and the one that failed, and its `wallSeconds` measured the desktop session. 1024 MiB is the floor
# because a Gradle gate plus its daemons needs more than that to finish inside `LOOP_CHILD_MAX_SECONDS`. `0`
# disables the check.
LOOP_MIN_FREE_MIB=1024
# Where this host publishes the memory it has available: `MemAvailable:` in this file, in kB, divided to MiB and
# compared against `LOOP_MIN_FREE_MIB` before an item's first child is started. A host that has no such file — a
# container without procfs, or a platform that keeps the number elsewhere — makes the check pass, because a check
# that cannot be made is not a refusal and the engine must run there too. Empty is the same as an absent file.
# The key exists so the self-test can point the reading at a file of its own, and so a host that publishes the
# number somewhere else records it here rather than in a phase.
LOOP_MEMINFO_PATH="/proc/meminfo"

# Where `state.sh init` keeps the state it replaces, so a finished run's counters, verdicts and stop reason
# survive the next run starting (issue #207). Empty means `runs/` beside the state file — derived from the
# state, so the engine still names no project path. A project that archives elsewhere records the directory
# here; a relative value is relative to the project root. Archives are machine-local like the state itself:
# they live under `.pi/`, which is gitignored, and they are never committed.
LOOP_RUNS_DIR=""

# Where the loop's tooling puts throwaway trees. The self-test creates one `<prefix><random>` tree per suite
# under it, and `tools/loop/loop-clean.sh` reports and removes the ones a suite killed with `SIGKILL` left
# behind — a trapped signal is cleaned up by the suite itself, and `kill -9` cannot be trapped. Empty means
# `.pi/tmp` under the project root, which is gitignored; a relative value is relative to the project root.
# Measured 2026-10-20 (issue #210): 90 MB across four `loop-selftest.*` trees, every one of them from a suite
# that was killed.
LOOP_TMP_DIR=""
# How old a tree under `LOOP_TMP_DIR` must be before `loop-clean` treats it as left behind rather than as a
# suite that is writing into it right now. Only the age can tell the two apart — a killed suite leaves no
# lock that outlives it — so this is a host fact with a wide margin, recorded here and not in the engine.
LOOP_TMP_STALE_MINUTES=120
# How many cases the self-test runs at once. Every case owns a throwaway repository, a scratch tree of its own and a
# process group of its own, and they share nothing but the read-only engine, so the suite is bounded by the host
# rather than by the cases: measured 2026-10-22 (issue #260), 163 cases ran strictly one after another and took
# 723 s. Empty means the host's CPU count (`nproc`, else `getconf _NPROCESSORS_ONLN`); a value set here bounds a
# host whose timing-sensitive cases want fewer, and `tools/loop/tests/loop-selftest.sh --jobs <n>` bounds one invocation.
LOOP_SELFTEST_JOBS=""
# How long one case of the self-test may run before the suite ends it (issue #308). A bound per case, not per suite:
# measured 2026-10-25, a case that never returned held the suite — and the gate behind it — for **56 minutes**, the
# worker that ran that gate was then ended by its own `LOOP_CHILD_MAX_SECONDS`, and the item it was working on was
# left with uncommitted work. The suite's slowest case is 9–15 s and all 223 cases together took 273 s the same day,
# so the default is 60× the slowest case; a case that needs more raises this key. Empty, non-numeric or `0` is the
# default rather than a refused suite. What the bound ends is the case's process group, and the line it prints names
# the case and the bound (`FAIL <case> (exceeded <n> s)`).
#
# **The value is per worker, not per suite.** The suite runs one case per CPU (`LOOP_SELFTEST_JOBS`, else the host's
# count) and multiplies this bound by that pool, because a case that *waits* — for a child's timeout, a heartbeat
# interval, a report window — has its wall clock read by the scheduler and not by itself. Measured 2026-11-04
# (issue #766): on the 4-vCPU CI runner three runs of one tree went red on a different case each time
# (`run#reviewBudgetIsARecordedValue`, then `run#aReviewerEndedAtItsTurnBoundIsNotARefusal` with three `report#*`
# cases), every one green alone, and `LOOP_SELFTEST_JOBS=4 bash tools/loop/tests/loop-selftest.sh` reproduced it on a 16-vCPU
# host at `FAIL run#aReviewerEndedAtItsTurnBoundIsNotARefusal (exceeded 900 s)`. A run prints the pool and the bound
# it applied (`loop-selftest: <n> case(s) at a time, <bound> s per case`), and `driver#theCaseBoundScalesWithThePool`
# holds the derivation.
LOOP_CASE_MAX_SECONDS=900
# How long one gate step may run before the gate ends it (issue #311). The gate is one clock inside a child the run
# already bounds by `LOOP_CHILD_MAX_SECONDS`, and nothing bounded a step *inside* it: measured 2026-10-25, one
# `tools/loop/tests/loop-selftest.sh` step consumed a worker's whole wall-clock, the run ended that child, and the item — whose
# gate log already read `LOOP-GATE: tests=558 failures=0 errors=0` and whose evidence check already read PASS — was
# recorded `blocked` with its work uncommitted. The step this bounds is the gate's unit, not the gate: a change that
# owes the build *and* three suites owes four clocks of this size. A step the bound reaches is ended together with
# everything it started, named on the console (`… — the step overran its bound of <n>s and was ended`) and in a
# `LOOP-GATE-STEP:` line of its own tally, and counted as an error of that step, so the gate exits non-zero instead
# of killing the child that runs it. The slowest step this host measured is **345 s** — the whole build-and-test gate,
# `guidelines/Build.md` §2c, 2026-10-21, 16-core host — and the whole self-test suite (223 cases) took **273 s** the
# same week, so the default is ~5× the slowest step and still leaves 900 s of a 2 700 s child for the phases the gate
# is not: 1800 s. A step that needs more raises this key.
LOOP_GATE_STEP_MAX_SECONDS=1800
# How many gate steps one wave may run at once (issue #801). A change that touches `tools/loop/**`, `tools/issues/**`
# or the pipeline owes the build and four shell suites, and only the build has to be alone: it owns the build
# directory the suites read through the environment, while each suite resolves a scratch tree of its own (a `mktemp
# -d` per invocation) and writes a tally of its own — measured in this tree, `tools/loop/tests/loop-selftest.sh:193`,
# `tools/loop/tests/loop-mutations-selftest.sh:34` and `tools/issues/tests/issue-tooling-selftest.sh:42` are the three scratch roots. The
# gate runs them one after another anyway while this key is 1, which is what it did before the key existed; the
# engine's default is 4, the number of suites a `tools/loop/**` delta owes here, and `1` is the serial gate for a
# host where they do contend (the suite's own per-repository lock, issue #295, is about two suites in one repository
# and is not a fact this key can read). The pool is bounded by the same per-step clock as a lone step:
# `LOOP_GATE_STEP_MAX_SECONDS` above and the caller's ceiling (issue #692) bound the wave, not the step count.
LOOP_GATE_POOL_JOBS=4
# The ceiling of the process that started this invocation, in seconds — **named by the caller**, never assumed, and
# empty when nobody names one (issue #692). Both bounds above are recorded project values, and every one of them
# (900, 1 800, 2 700, 3 900 s) sat at or above the 900 s at which the harness a child runs under ends one tool call:
# measured twice on 2026-10-28, `Error: Tool 'ctx_shell' exceeded its timeout of 900000ms.`, both mid-suite and both
# with the child's work uncommitted, and the orphaned suite of the second kept the host for 1 383 s after the child
# was gone (the tracker's own clock, issue #692). A project file cannot see that ceiling — the harness exports no such value (`grep -n 'TIMEOUT'` over its
# own environment documentation names a terminal escape timing and nothing else) — so the caller states it here
# instead, at the call site: `LOOP_CALL_CEILING_SECONDS=890 bash tools/loop/tests/loop-selftest.sh --from-git <base>`.
#
# The value is **the last second this invocation may still be running**, not the caller's hard kill: a caller that is
# killed at 900 names 890, and the margin between the two is the caller's to choose rather than a project constant
# invented for a host nobody measured. What it buys is that the process which ends an overrun is the one that can
# still say so — the suite prints `LOOP-SUITE-CEILING:` with what it covered, the gate writes its `LOOP-GATE-STEP:`
# line naming the step — instead of the caller killing the call with the item's work uncommitted (issue #692).
#
# Empty, non-numeric or `0` is no ceiling, and that is the shape this project ran in until now: every bound keeps its
# recorded value and no watcher is started. The fill-if-unset assignment is what lets a caller name it through the
# environment without editing a file, the same shape `LOOP_BASE_REF` below uses — this file is sourced after the
# environment, so a plain assignment would silently drop the caller's answer.
LOOP_CALL_CEILING_SECONDS="${LOOP_CALL_CEILING_SECONDS:-}"

# ── the project-specific keys (D16) ───────────────────────────────────────────────────────

# How many characters of one tool result a child may carry, and the line that is cut to it (issue #660). A child's
# tool result used to enter its context whole and be re-read by every later turn: over the archive this key was
# measured on (`.pi/issue-loop/items`, read by `python3 tools/loop-spend.py`) the children injected **59.2 M
# characters** of tool output once and re-read 876.4 M tokens of it — 53 % of the 1.66 B the archive spent — with a
# single `ctx_read` of 116.6 k characters (#78) and a 51.3 k `ctx_shell` at the top, while the median result is
# **825** characters and p75 is 2 917. The bound is therefore a rule about the tail, not about reading, and the
# number is the archive's own p90 rounded up: `evidence/result-sizes.py` in the change
# `2026-10-27-fix-a-tool-result-over-its-bound-is-trimmed` prints `n=22901 chars=59179014`,
# `p50=825`, `p75=2917`, `p90=7194`, `p95=13684`, `p99=16149`, `max=116628`, and `bound=8000 above=2052 share=9.0%`.
# What it buys is `LOOP-SPEND-CAP8K saved=228988001` — 14 % of the archive; 16 000 sits just under that p99 and
# above 1.2 % of the results, and buys 2 % (`LOOP-SPEND-CAP16K saved=29640189`), and 4 000 cuts 18.9 % of all
# results for 27 % (`LOOP-SPEND-CAP4K saved=453282909`), which is one result in five of the material an item is
# worked from. Nine results in ten are handed over byte for byte.
#
# It is applied where a result passes from the tool to the child and not by asking the child to read less: prose
# is not what bounds the tail. `tools/loop/prompts/worker.md` has asked a child to read the section it needs and to
# cite a file rather than read it again since #246, and the archive still records `LOOP-SPEND-READS calls=4798
# duplicate=2174` — 45 % of its reads are a second read of a path it already read. This project's adapter,
# `tools/pi-child-events.sh`, loads `tools/pi-trim-result.mjs` with every child and reads this key — read, never
# sourced — so the number has one home; `0`, or a project that records no key, means no bound, and a ported
# project that deletes the adapter owes nothing by it. The engine reads no such key: it is here, in the
# project-specific block, because it is this project's adapter that applies it (D16).
LOOP_TOOL_RESULT_MAX_CHARS=8000

# How large one item's kept event stream may grow before the adapter rotates it (issue #802). The file
# `tools/pi-child-events.sh` appends to (`items/<n>/events.jsonl`) had no bound of any kind and is the largest thing
# the loop keeps: measured 2026-11-06 over this archive (`evidence/archive-census.py` in the change
# `fix-an-item-stream-is-bounded-and-reported`), 254 streams held **3 483 MiB** — `p50=11.84MiB p90=29.88MiB
# max=63.47MiB` — and one item held 65 MiB while its directory is read again for every turn count. The bound is above
# the median item's **whole** history, so an ordinary item keeps every line and only the tail that makes the archive
# gigabytes is capped: `bound=16MiB kept-sum=2573MiB` against 3 483 MiB unbounded (4 MiB would leave 891 MiB and 8 MiB
# 1 584 MiB, but both rotate more than half the items' complete streams away). `0`, or a project that records no key,
# is no bound, and a ported project that deletes the adapter owes nothing by it. The adapter reads this key — read,
# never sourced — and `run.sh`'s `child_turns` adds the turns a rotation records, so the bound a child is ended by
# does not reset when the writer rotates.
#
# What a rotation drops is the **streamed deltas** and not the oldest lines (issue #840): `message_update` and
# `tool_execution_update` go, every record line stays, and only a stream that is still over this bound afterwards is
# cut at its oldest half. The bound's own justification is what made this necessary — a rotation decided by line
# position dropped the records the spent figures are summed from, and in the run started 2026-11-09T21:42:41Z nine of
# fifteen item streams rotated and dropped **1 697 `turn_end` records against the 1 372 turns the state recorded**, so
# each of those items' `metrics.turns`, `tokens`, `phases`, `roles` and `afterGate` was a lower bound printed as a
# measurement. What fills a stream is deltas: in `items/833/events.jsonl` `message_update` carried 4 741 310 of the
# 8 565 562 surviving bytes (55 %) and `tool_execution_update` 255 184 (3 %), and 16 662 of its ~17 400 lines were
# updates. `message_update` is only dropped when every `turn_end` of that stream carries `message.usage` for the turn
# to be read from instead — a provider that reports usage on the updates alone keeps them, and only
# `tool_execution_update` (read by nothing) goes. A stream that overflows after that pass is a lower bound still
# (issue #841), and it stays a recorded one.
#
# What the record's bytes are **not** (issue #840): `dropped_bytes` describes the removals of the rotation that wrote
# it, and never those of a rotation before it — a rotation replaces the record it finds and carries only
# `dropped_turn_ends` forward. A stream rotated twice therefore has no byte total left to recover, and the figure a
# reader prints for it is the last rotation's alone; the turn count is the only cumulative one of the pair.
LOOP_CHILD_EVENTS_MAX_BYTES=16777216

# How long the loop keeps an item directory that no open issue cites, for `tools/loop/loop-clean.sh`'s item arm
# (issue #802). The item directories are the loop's largest leftover — measured the same day, `.pi/issue-loop/held
# items=264 **3 563 MiB**` — and no cleanup arm reported them. A directory is released only when nothing inside it has
# been written for this many days **and** the run recorded the item `done` with its closure (`metrics.closed: yes`),
# so an item whose issue is still open, or whose landing the run was not allowed to close, is kept and named with
# that reason. 14 days releases 105 directories holding 1 411 MiB on the day it was measured and nothing younger;
# 7 would release 215 directories and 2 757 MiB, and 30 released none at all, the archive being younger than that.
# `0`, or a project that records no key, releases nothing.
LOOP_ITEM_ARCHIVE_DAYS=14

# The one gitignored directory a stopped run copies into `<item dir>/leftover-from-killed-run.patch` instead of only
# naming it (issue #308): this project's unarchived changes live under `openspec/changes/*/`, which is gitignored, and
# an unarchived change is exactly the work a killed worker leaves behind — `git status` does not show it, so a patch
# of the tracked diff alone would keep the code and lose every artifact that proves it. Measured 2026-10-25: the item
# whose gate hung was reconstructed by hand from `git status` and a diff for exactly that reason. Every other ignored
# path is *named* in the patch's header rather than copied, so no build directory lands in it, and so is any file
# above the patch's size bound. Empty means no ignored path is copied. Relative to the project root.
LOOP_UNTRACKED_RECORD_DIR="openspec/changes"

# Where the change an item names lives, relative to the project root — the directory family the run copies into
# the item's worktree (`worktree.sh start-item --change`) and the one `loop-clean.sh` reports after the item landed.
# The layout is OpenSpec's own, so it is a path this project records and a ported project declares, never a literal
# in the engine (`tools/check-portability.sh`). Empty means the engine's fallback, `openspec/changes`, and a project
# that keeps its changes elsewhere states the directory here.
LOOP_CHANGE_SOURCE_DIR="openspec/changes"

# How a child process is started — the ONE indirection through which every agent process is started
# (D3). A future sandbox change sets this to an `sbx exec …` invocation and touches nothing else.
#
# The value names *this project's* adapter with the agent as its argument, and the path is relative to the
# project root exactly as `LOOP_GATE_CMD` is (the run starts every child there). The adapter is outside the
# engine on purpose: it is where `--mode json` lives, so no script under `tools/loop/` names an agent command
# or a mode flag, and a second project points this key at its own adapter or at its own plain-text command.
# What the adapter does with the stream, and why the stream matters, is `tools/pi-child-events.sh`.
LOOP_AGENT_CMD="bash tools/pi-child-events.sh pi"

# A command per role, for a project that does not run every child on the same model. The key is
# `LOOP_AGENT_CMD_<ROLE>` and the role is read off the prompt's name by `run.sh`'s `child_role`: `WORKER`,
# `WORKER_GATE` (the child that runs the gate), `WORKER_TAIL` (the child started after the gate), `WORKER_REWORK` (the
# round a refusal buys), `REVIEWER` and `REVIEWER_PRE_GATE` (the round that reads the diff before the gate). A role
# whose key is empty keeps the key of the role its name qualifies — `REVIEWER_PRE_GATE` inherits `REVIEWER`,
# `WORKER_GATE`/`WORKER_TAIL`/`WORKER_REWORK` inherit `WORKER` — and only a role whose head records nothing keeps
# `LOOP_AGENT_CMD`, so a project that configures nothing runs one command everywhere and this block changes nothing; a
# project that wants its reviewer on a cheaper model records
# `LOOP_AGENT_CMD_REVIEWER="bash tools/pi-child-events.sh pi --model <id>"` here and touches no phase. A key may also
# carry the item's class (`LOOP_AGENT_CMD_WORKER_<CLASS>`, the class upper-cased), which is how a project prices a
# feature's worker pass apart from a bug's; the most specific key wins, so a role's own key still beats its head's
# class key. The chain and its eliminated alternatives are `design.md` of the change
# `fix-a-childs-command-is-keyed-by-role-and-class` (issue #821).
#
# What the split is worth is measured, not assumed (2026-11-03, 227 items, `tools/loop-spend.py --json`): the
# reviewer's 7 522 turns carry 53.6 k tokens each, the worker's 25 654 carry 84.5 k, and the reviewer's whole
# job is a diff read against the item's own checklist — the cheapest half of the work to move to a smaller
# model. The keys exist so that choice is a recorded value; which model is best is not a fact this file knows.
# The reviewer runs on a cheaper model, measured on one archived item rather than assumed (2026-11-07, item #116
# replayed against its own recorded report, `docs/2026-11-07-reviewer-model-analysis.md`): minimax-m3.1-flash
# recovered the blocking finding the recorded round found, quoted it with diff line numbers, and produced one
# finding the recorded round missed; it is $0.15/$0.60 per Mtok against deepseek-v4.1-flash's $0.30/$1.20, with a
# 976 k window — the whole 891 kB two-diff session the replay loads. `beam`, `nemotron-3-super` and
# `nemotron-3-nano:30b` failed the same run (a PASS over the defect, a trailer with no report, fabricated evidence).
# The switch is worth re-taking, not trusting: `docs/`'s report carries the recipe and the skill
# `reviewer-model-benchmark` re-runs it.
# The split between the two, measured over the archive rather than assumed (275 items, `tools/loop-spend.py --json`,
# 2026-11-07): worker 1 926 M tokens (63 %), reviewer 509 M (16 %), the rework round 458 M (15 %), and the three
# mechanical children — the gate runner, the tail child that writes the verdict, and the pre-gate round — 143 M
# together (4 %). Ninety-six percent of every figure is cache re-read, so the price per token is the lever, and the
# keys below move the work whose *judgement* is smallest first. Recorded 2026-11-07 on the owner's decision: the
# mechanical three go to `mimo-v2.6-flash` ($0.14/$0.28, 1 M window, passed the qualifying gates of
# `docs/2026-11-07-reviewer-model-analysis.md` but not byte-exact in its probe — acceptable for a child that runs a
# command and quotes its output), and the rework round to `minimax-m3.1-flash` (the reviewer's model: it edits code
# under a refusal's corrections, so the model that was byte-exact is the one it keeps). The worker's own passes stay
# on the default model, because 63 % of the spend is where a wrong edit costs a whole item.
LOOP_AGENT_CMD_WORKER=""
LOOP_AGENT_CMD_WORKER_GATE="bash tools/pi-child-events.sh pi --model ollama-cloud/mimo-v2.6-flash"
LOOP_AGENT_CMD_WORKER_TAIL="bash tools/pi-child-events.sh pi --model ollama-cloud/mimo-v2.6-flash"
LOOP_AGENT_CMD_WORKER_REWORK="bash tools/pi-child-events.sh pi --model ollama-cloud/minimax-m3.1-flash"
LOOP_AGENT_CMD_REVIEWER="bash tools/pi-child-events.sh pi --model ollama-cloud/minimax-m3.1-flash"
LOOP_AGENT_CMD_REVIEWER_PRE_GATE="bash tools/pi-child-events.sh pi --model ollama-cloud/mimo-v2.6-flash"

# Which of this project's skills the worker is told to use. The worker prompt skeleton carries a
# placeholder; these names are substituted into it at render time.
LOOP_WORKER_SKILLS="openspec-propose openspec-apply-change build-app run-tests revert-check"

# How this project's gate is run. Empty for a project with no build system: the phases still run and
# the report says the gate was skipped, because the gate is the project's, not the loop's. The invocation is
# the one this host completes: measured 2026-10-19, the same 5680 tests took **3m47s** through
# `-PforceTests --no-build-cache` and *never reached a suite* through `--rerun-tasks` (30 min inside
# `:app:kspMobileDebugUnitTestKotlin` at 194 MB free RAM and 18 GB swap). The flag table and the reason are
# `guidelines/Build.md` §4 and `.pi/skills/run-tests`; the gate is run **once** per item, and a gate that
# outlasts `LOOP_CHILD_MAX_SECONDS` blocks the item instead of being retried (issue #203).
LOOP_GATE_CMD="./tools/loop/gate.sh"

# How many full runs of that gate one child may spend before the gate itself refuses a further one and hands it the
# scoped command instead (issue #756). The gate is the only expensive action a *child* runs rather than the run, so
# the run's turn bound cannot see it, and the prompt that asks for one gate (`tools/loop/prompts/worker-gate.md`)
# had nothing behind it. Measured 2026-11-03 over the archive's 227 items and 558 child sessions
# (`.pi/issue-loop/items/*/events.jsonl`, durations from each `tool_execution_end`): the gate was started **910 times
# and spent 35.1 h** — 60 % of all tool wall clock — 245 sessions ran it at all, and **117 of those (48 %) ran it
# three or more times** (#670 44 times in 174 turns, #116 39 times in 152); 65 items spent more than 15 minutes inside
# it. A full round is 600–1 100 s, so a 480-minute run can spend its budget on gate rounds and never reach the
# review. `2` is the value the measurement supports: the first round is the measurement, the second is what a red
# one buys, and everything after it repeats suites the item has already paid for. The gate leaves one record per full
# run it starts, beside the stream the child's adapter keeps (`<events>.gate-runs` under
# `LOOP_CHILD_EVENTS`), and counts only the records that carry the id of the session it is running in — the gate is
# charged for this child's runs, never for a previous child's. `0`, or a profile that records no such key, is no bound:
# a project that wants a child to be able to re-gate records a larger number here rather than editing a phase (D16).
LOOP_GATE_RUNS_MAX=2

# The one command that answers what a change's pathspec owes and what numbers its evidence already carries — the
# worker is handed it as `{{MEASURE_CMD}}`, and it is a reading command: it runs no check, because the gate above
# is run once per item. Measured (issue #246, `.pi/issue-loop/items/{69,133,11,13,98}/events.jsonl`): an item
# spends 73 to 244 shell calls and 22 to 79 file reads, one model turn each, against 2 s to 575 s of tool time in
# 291 s to 1 644 s of wall clock — so the facts a worker needs before it plans belong to one call's output rather
# than to a walk of the tree. Empty for a project with no such command: the prompt then says so instead of naming
# a path that is not there.
LOOP_MEASURE_CMD="./tools/loop/measure.sh"

# The one command that prints the project's declared test cases, one per line, **without running one** — the
# measuring block carries its count, so a change quotes the suite's size from a command rather than counting cases
# by hand. Measured (issue #244, `.pi/issue-loop/items/*/reviewer-report-1.md`, 2026-10-21): 147 `UNPROVEN` claims
# in the round-1 reports, a change asserting "the existing 148 shell cases" where the tree held 130 and the base
# 128. It is a reading command like the one above, and the profile owns it because the suite's name and its
# listing flag are the project's. Empty for a project whose suite cannot list its cases: the block then says so
# instead of reporting a count of zero.
LOOP_SUITE_CASES_CMD="tools/loop/tests/loop-selftest.sh --list"

# **May the run start another item now?** — the one question the loop asks about a *quota*, and the command that
# answers it. Empty for a project whose provider has no such reading: `state.sh next` then asks nothing and the
# run's own bounds are the whole authority (the engine's behaviour before this key existed).
#
# The command is this project's, never the engine's (`tools/check-portability.sh`): `tools/loop-quota.sh` reads the
# balance endpoint, and no script under `tools/loop/` names a URL, a provider or a percentage. It is run at the
# boundary between two items, in the project root, with the three numbers below in its environment, and it answers
# with its **exit status**: `0` the run may go on, `3` the run must wait — its stdout then carries the reason and a
# last line `resume-at <epoch-seconds>` naming when the condition clears — and any other status is a check that
# could not be made, which is not a refusal: the run goes on and says so on stderr.
#
# Measured 2026-11-08 (the endpoint's own answer): a short window refilling every few hours and a weekly window at
# the top of its week, as **percentages** — the usage endpoint answers request counts of the retired subscription
# shape and was discarded for that reason — rate limited to **10 requests a minute per user, shared**, which is why
# nothing here polls: one call at a boundary between two items and one per wait, and a wait is minutes to hours.
#
# **The switch.** The value is written as a fill-if-unset expansion, exactly as `LOOP_BASE_REF` below, so a **set**
# environment value wins and the check can be turned off for one run without editing this file:
# `LOOP_QUOTA_CMD= ./tools/loop/run.sh …`, or `./tools/loop/run.sh --no-quota …`. `-` and not `:-`, because a
# *set-but-empty* value is the switch and a plain assignment would ignore it — this file is sourced **after** the
# environment (`lib.sh`'s `loop_resolve`). The run's header names the reader it armed, or `quota=off`.
#
# **The reader belongs to one provider.** It answers for the quota of the provider the agent commands use
# (`LOOP_AGENT_CMD*`, `loop_resolve`); it knows nothing about any other, and this key cannot tell which one a given
# run spends. A run on another provider with this reader armed waits for a window it is not spending — measured
# 2026-11-08: the reader answers "the weekly quota has 0 % left" for six hours, while a run whose children are
# configured for a different provider spends that provider's quota and nothing of Ollama's. So the pairing is the
# operator's: point this key at the reader of the provider in use, leave it empty, or pass `--no-quota`. The engine
# cannot check the pairing for you — which provider a project's agents use is a project value, and no script under
# `tools/loop/` may name one (D1).
LOOP_QUOTA_CMD="${LOOP_QUOTA_CMD-bash tools/loop-quota.sh}"

# The share of a window the run refuses to go below, in percent — the reserve it does not borrow from the future.
# The short window's floor is the larger because the short window *returns* within hours; a weekly window that
# returns at the top of a week does not, so its floor is the smaller and what paces the week is the line below.
# An empty value takes the reader's own default (15 and 5).
LOOP_QUOTA_SESSION_MIN_PERCENT="15"
LOOP_QUOTA_WEEKLY_MIN_PERCENT="5"

# How much of the weekly window is **kept back** for every other consumer of the same quota, in percent: the pacing
# line the reader draws is the fraction of the week elapsed less this reserve, and the run waits when the window is
# burned past it. The allowance is a rate over the week, not a pot, so a run that spends the week flat out on day
# one buys nothing for the six days after it — and the owner's own use of the same quota is the consumer this
# reserve exists for. Empty takes the reader's own default (10).
LOOP_QUOTA_PACING_RESERVE_PERCENT="10"

# How long the run waits when the reader names **no** reset instant (`resume-at 0`), in seconds, and how long it
# will wait at all: a wait longer than `LOOP_QUOTA_HOLD_MAX_SECONDS` ends the run instead of pausing it, so a quota
# that never comes back cannot leave a run asleep for a week. `0` is no cap — the recorded default, because a
# weekly window legitimately resets days away and the run's `--minutes` no longer bounds a pause: a hold moves the
# deadline with it (`state.sh hold`), which is what makes "pause and resume" mean anything.
LOOP_QUOTA_POLL_SECONDS="900"
LOOP_QUOTA_HOLD_MAX_SECONDS="0"

# **The branch every item descends from** — the run records this branch's commit as the base, and the landing step
# merges back into it (issue #301). It is a key here because it is a name of *this project's*: a project whose base
# branch is `trunk` or `develop` records it here and edits no engine (issue #303). The value is written as a
# fill-if-unset expansion because this file is sourced **after** the environment (`lib.sh`'s `loop_resolve`), so a
# plain assignment would silently ignore an inherited `LOOP_BASE_REF` — as written, the environment wins and an unset
# environment takes the branch recorded here. The engine's own default (`main`) stays as the fallback for a
# configuration that records none, which is the only case in which it is read.
LOOP_BASE_REF="${LOOP_BASE_REF:-main}"

# The gate a delta owes is the one its pathspec asks for (issue #242): `./gradlew test` alone let a landing pass
# in the run and break `tools/tests/check-portability-selftest.sh` in the pipeline, which reddened `main` on
# 2026-10-21. `gate.sh` reads the keys below and runs what the change touches: the build's own gate when a
# compiled path changed, and the shell commands of the pipeline's check steps that read the touched paths
# otherwise. `Build.md` §2 states the rule; these lines are this project's mapping of it, which is why they live
# in the profile and not in the engine. Both sides of the map are pinned: every `bash`/`sh` command a `Check …`
# step runs is a value of `LOOP_GATE_SUITES`, and every path a step's tools read is a glob that owes that step's
# command set. The reader edges were measured once and are hand-kept, so a *new* pipeline step, and a reader
# edge it adds, are the residual (`gate#theMapCoversEveryPipelineStep` pins the command side and
# `gate#aPathACheckReadsOwesThatStepsCommandSet` the path side, so either escape is a red loop suite rather
# than a red `main`; issue #242, #289).
#
# A compiled path is one a tree the build reads holds, or one whose name is the convention for a build input, so
# the patterns below name *where* a path sits or *which* build input it is — `Build.md` §2a's scope block already
# says `*.md`, `openspec/**`, `.pi/**`, `guidelines/**` and `tools/**` are no compiled file. A basename pattern
# read an archived evidence tally as compiled: `*.xml` matched
# `openspec/changes/archive/<x>/evidence/gate-tallies/a.xml`, so a delta that touches no compiled file owed
# `./gradlew test -PforceTests --no-build-cache` for an archive commit whose diff carried four evidence XMLs — the
# same tree owed the three shell suites, `tests=202 failures=0`, before that commit and the Kotlin suite after it
# (measured 2026-10-23, issue #273; the item reports 13 min 15 s, its log carries the tally and no duration). Two
# other trees carried the same false positive: the `tools/tests/fixtures/` `.xml` that mimic test reports, and
# `tools/issues/core/*.java`, which the shell suites compile with `javac`.
# `*/src/*` is a module's source tree whatever the module is called, so a module added later is gated without
# this line being edited; `*/lint.xml` is a module's lint configuration, which the build reads. A Gradle script and
# a toolchain `.toml` stay name-based because their names are the convention — which also gates a Gradle init
# script beside the build (`tools/gate-timings.init.gradle.kts`) and the root `hmm_mise.toml`; `*.gradle` matches
# no file today. Neither name-based pattern reaches an evidence tally or a fixture (issue #273, round 2).
LOOP_GATE_TALLY_DIR="app/build/test-results/loop-gate"
# What the evidence check reads in this project (`tools/loop/evidence-check.sh`): the source roots a falsification
# plants its `REVERT-CHECK MUTATION` marker in, and the build directory the JUnit tallies land under. Both are
# project paths, so they are configuration and not literals in the engine — the rule `tools/check-portability.sh`
# enforces (issue #255). A configured path that does not exist is reported by the check, never read as "clean".
LOOP_EVIDENCE_SCAN_PATHS="app/src"
LOOP_EVIDENCE_XML_DIR="app/build/test-results"
# `-PjvmTestsOnly` is passed because the gate is a JVM-only run: the licence inventory is a variant asset
# source, so without it the unit-test graph carries `generateLicenseAssets` → `generateSbom` →
# `mergeNativeSbom` and a tree without a vcpkg checkout cannot configure the suite at all (issue #270, spec
# `build-sbom` — "A JVM-only test run does not require the native tree"). The strict artefact path is still
# covered, by the CI steps that assemble and generate the SBOM with the vcpkg tree present.
LOOP_GATE_COMPILED_CMD="./gradlew test -PforceTests -PjvmTestsOnly --no-build-cache"
LOOP_GATE_COMPILED_PATTERNS="*/src/* */lint.xml *.gradle.kts *.gradle *.toml CMakeLists.txt"
# The pipeline the map below is pinned to: the workflow whose `Check …` steps are the gate's steps, so every
# `bash`/`sh` command one of them runs has to be a value of the map. `gate#theMapCoversEveryPipelineStep` is the
# pin — it fails naming each command the map is missing — so a new pipeline step is a red loop suite instead of a
# red `main`. The pin reads a step's `run:` line that names a script and nothing else: a step whose check is inline
# shell or a Gradle task is outside it (`Check daemon JVM criteria` over `gradle/gradle-daemon-jvm.properties`).
# Empty for a project with no pipeline: the map is then a copy with no alarm.
LOOP_GATE_PIPELINE=".github/workflows/build.yml"
# The map's unit is a pipeline *step*, but a path carries the commands of the tool it names, not necessarily all
# of the step: a tool's check, its self-test and its mutation list are carried together (`tools/build-inputs*`
# offers all three), while a step's other commands are carried by the paths of their own tools, because the
# pipeline runs the step as a unit and any of its commands can be the one that reddens.
#
# The classification pair is the project's own reading of the same rule, and it is here for the reason this key
# exists: an `openspec/` path — the delta a change writes, and the archive move that ships it — owes the gate that
# names an unclassified capability, and the tool's suite is what proves the gate reads both sets (issue #101).
#
# The last two pairs are the *records* of the loop's mutation set against the lines they quote (issue #264). The
# harness's own cases were the gate for `tools/loop/tests/loop-mutations.sh`, and they prove the harness can report a record
# that no longer matches; nothing applied the declared records to the files they name, so `9.9` and `12.2` named a
# `run.sh` line that #227 had replaced and no gate noticed. It is owed for an engine path — the edit that orphans a
# record is an edit to the file the record quotes — and for the set itself. The full set stays a hand-run before a
# change that owns `tools/loop/**` is archived — 84 records × two case runs is the 21-minute pass of issue #235,
# which is why the bound exists — while this check reads the whole declared set in the time of 84 `sed` calls.
#
# The first pair carries `{base}`: the loop's self-test owes the cases the delta's own files declare, not the whole
# set. The token is the gate's (`gate.sh` replaces it with the base it resolved, from the same diff it computed the
# paths from), so nothing here restates the paths, and `--from-git` is the filter the harness's records already use.
# Measured 2026-10-23 (issue #276): the set is 190 cases and 723 s, and a delta under `tools/loop/` touches a file a
# handful of them declare. The whole set is still owed before a change that owns `tools/loop/**` is archived.
#
# The `--from-git {base}` suffix is the gate's own narrowing, not part of the pipeline command, so the pin strips
# it before comparing: the map value names the command the pipeline runs, with the gate's filter appended.
#
# The reader edges (issue #289). A path a check *reads* but does not name by a glob of its own tool used to owe
# nothing of that step: `tools/check-portability.sh` reads `tools/loop/loop.conf`, `tools/tooling.json`,
# `tools/sensors/sensors.json` and scans `tools/loop/*.sh`, `tools/sensors/*.sh`, `tools/issues/*.sh` as its
# engine set, so a project value planted in any of them reddened `Check portability` while the run's gate said
# "nothing owed" — the 2026-10-21 shape. Each measured edge now owes that step's *whole* command set, because
# the pipeline runs the step as a unit and any of its commands can be the one that reddens. The pairs below
# are the measured edge set, not a rule a workflow can confirm: a step added later carries its own edges.
#
# The second measured edge set is `Check issue tooling` (issue #289, the P1 of the change's review): its case
# `lib#onlyTheSeamCallsTheRealCli` greps `tools/loop/*.sh` and `tools/sensors/*.sh` for a call that reaches the
# real CLI, and its taxonomy case reads `tools/sensors/sensors.json`, so a delta touching one of them can redden
# that step while the map owed none of it. The same whole-step rule applies: all six commands of the step.
# `tools/gate-attribute*` owes the loop's self-test because that is where its cases live (`gate#aGreenLogNamesNoFailingCase`
# and its neighbours, issue #689): the reader of a gate log is held by the suite whose output it reads.
#
# The readiness checker (`tools/check-change-readiness.sh`, capability `change-readiness`) owes three entries for
# the reason `tools/check-doc-routes*` does: the checker, its self-test, and its mutation list as `--list`, so
# editing the checker runs the cases that cover it and a mutation set that no longer parses fails the suite
# instead of rotting. The first entry is `--help` and not a run over the tree: this checker's tree-wide verdict is
# `refused` for every change that predates the declaration (15 of 19 on 2026-10-30,
# `openspec/changes/archive/2026-10-31-change-readiness-gate/evidence/readiness-on-open-changes.txt`), and a gate
# entry that is red for another change's debt would refuse every delta under `tools/check-change-readiness*`. Until C2
# (`finding-shape-at-filing`) names a caller, the CLI smoke is what the tree can hold there: it proves the script
# parses and that both invocation forms are documented, which is the shape task 1.2 of that change verifies.
LOOP_GATE_SUITES="tools/loop/*|tools/loop/tests/loop-selftest.sh --from-git {base};tools/loop/*|bash tools/loop/tests/loop-mutations.sh --check;tools/loop/tests/loop-cases.sh|tools/loop/tests/loop-selftest.sh --from-git {base};tools/loop/tests/loop-mutations.sh|tools/loop/tests/loop-mutations-selftest.sh;tools/loop/tests/loop-mutations.sh|bash tools/loop/tests/loop-mutations.sh --check;tools/loop/tests/loop-mutations-selftest.sh|tools/loop/tests/loop-mutations-selftest.sh;tools/loop/tests/loop-selftest.sh|tools/loop/tests/loop-selftest.sh --from-git {base};tools/loop/tests/loop-selftest.sh|bash tools/loop/tests/loop-mutations.sh --check;tools/mutate*|tools/tests/mutate-selftest.sh;tools/issues/*|tools/issues/tests/issue-tooling-selftest.sh;tools/issues/*|tools/issues/check-metadata.sh;tools/issues/*|tools/issues/tests/metadata-mutations.sh --list;tools/tooling.json|tools/issues/tests/issue-tooling-selftest.sh;tools/issues/tests/issue-tooling-cases.sh|tools/issues/tests/issue-tooling-selftest.sh;tools/issues/tests/status-mutations.json|tools/mutate.sh --mutations tools/issues/tests/status-mutations.json --list;tools/issues/tests/create-mutations.json|tools/mutate.sh --mutations tools/issues/tests/create-mutations.json --list;tools/issues/tests/close-mutations.json|tools/mutate.sh --mutations tools/issues/tests/close-mutations.json --list;tools/issues/tests/duplicates-mutations.json|tools/mutate.sh --mutations tools/issues/tests/duplicates-mutations.json --list;tools/issues/tests/decision-question-mutations.json|tools/mutate.sh --mutations tools/issues/tests/decision-question-mutations.json --list;tools/sensors/*|tools/sensors/tests/sensor-selftest.sh;tools/sensor-*.sh|tools/sensors/tests/sensor-selftest.sh;tools/sensor*|tools/sensors/tests/sensor-mutations.sh --list;.github/workflows/sensors.yml|tools/sensors/tests/sensor-selftest.sh;.github/workflows/sensors.yml|tools/sensors/tests/sensor-mutations.sh --list;tools/build-inputs*|tools/build-inputs.sh --check;tools/build-inputs*|tools/tests/build-inputs-selftest.sh;tools/build-inputs*|tools/tests/build-inputs-mutations.sh --list;tools/check-portability*|tools/check-portability.sh;tools/check-portability*|tools/tests/check-portability-selftest.sh;tools/check-portability*|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/portability-*|tools/check-portability.sh;tools/portability-*|tools/tests/check-portability-selftest.sh;tools/portability-*|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/tests/fixtures/foreign-project/*|tools/tests/check-portability-selftest.sh;PORTING.md|tools/tests/check-portability-selftest.sh;tools/resolve-stale*|tools/issues/tests/resolve-stale-selftest.sh;tools/resolve-stale*|tools/mutate.sh --mutations tools/issues/tests/resolve-stale-mutations.json --list;tools/check-action-runtimes*|tools/check-action-runtimes.sh;tools/check-action-runtimes*|tools/tests/check-action-runtimes-selftest.sh;.github/workflows/*|tools/check-action-runtimes.sh;.github/workflows/*|tools/tests/check-action-runtimes-selftest.sh;tools/check-compose-sandbox-rule*|tools/check-compose-sandbox-rule.sh;tools/check-compose-sandbox-rule*|tools/tests/check-compose-sandbox-rule-selftest.sh;app/src/test/*|tools/check-compose-sandbox-rule.sh;app/src/test/*|tools/tests/check-compose-sandbox-rule-selftest.sh;tools/gen-feature-list*.sh|tools/tests/gen-feature-list-selftest.sh;tools/feature-list/*|tools/tests/gen-feature-list-selftest.sh;openspec/*|bash tools/gen-feature-list.sh --check-classification;tools/check-doc-routes*|tools/check-doc-routes.sh;tools/check-doc-routes*|tools/tests/check-doc-routes-selftest.sh;tools/check-doc-routes*|tools/mutate.sh --mutations tools/tests/check-doc-routes-mutations.json --list;*.md|tools/check-doc-routes.sh;*.md|tools/tests/check-doc-routes-selftest.sh;*.md|tools/mutate.sh --mutations tools/tests/check-doc-routes-mutations.json --list;*.md|tools/check-todo-references.sh;tools/check-todo-references*|tools/check-todo-references.sh;openspec/*|tools/check-doc-routes.sh;AGENTS.md|tools/check-doc-routes.sh;app/build.gradle.kts|tools/tests/check-jvm-test-graph-selftest.sh;app/build.gradle.kts|tools/tests/check-dex-gate-graph-selftest.sh;tools/check-dex-gate-graph*|tools/tests/check-dex-gate-graph-selftest.sh;buildSrc/*|tools/tests/check-jvm-test-graph-selftest.sh;openspec/*|tools/check-openspec-hygiene.sh;openspec/*|tools/tests/check-openspec-hygiene-selftest.sh;tools/check-openspec-hygiene*|tools/check-openspec-hygiene.sh;tools/check-openspec-hygiene*|tools/tests/check-openspec-hygiene-selftest.sh;app/build.gradle.kts|tools/tests/check-gate-artifacts-selftest.sh;core/build.gradle.kts|tools/tests/check-gate-artifacts-selftest.sh;buildSrc/*|tools/tests/check-gate-artifacts-selftest.sh;app/src/main/cpp/libosmscout/*|tools/tests/check-gate-artifacts-selftest.sh;tools/check-gate-artifacts*|tools/tests/check-gate-artifacts-selftest.sh;tools/loop/*|tools/check-portability.sh;tools/loop/*|tools/tests/check-portability-selftest.sh;tools/loop/*|tools/tests/mutate-selftest.sh;tools/loop/*|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/issues/*|tools/check-portability.sh;tools/issues/*|tools/tests/check-portability-selftest.sh;tools/issues/*|tools/tests/mutate-selftest.sh;tools/issues/*|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/sensors/*|tools/check-portability.sh;tools/sensors/*|tools/tests/check-portability-selftest.sh;tools/sensors/*|tools/tests/mutate-selftest.sh;tools/sensors/*|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/tooling.json|tools/check-portability.sh;tools/tooling.json|tools/tests/check-portability-selftest.sh;tools/tooling.json|tools/tests/mutate-selftest.sh;tools/tooling.json|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/tooling.json|tools/issues/check-metadata.sh;tools/tooling.json|tools/issues/tests/metadata-mutations.sh --list;tools/sensors/sensors.json|tools/check-portability.sh;tools/sensors/sensors.json|tools/tests/check-portability-selftest.sh;tools/sensors/sensors.json|tools/tests/mutate-selftest.sh;tools/sensors/sensors.json|tools/mutate.sh --mutations tools/tests/portability-mutations.json --list;tools/sensors/sensors.json|tools/tests/build-inputs-selftest.sh;tools/sensors/sensors.json|tools/build-inputs.sh --check;tools/sensors/sensors.json|tools/tests/build-inputs-mutations.sh --list;tools/sensors/sensors.json|tools/issues/check-metadata.sh;tools/sensors/sensors.json|tools/issues/tests/metadata-mutations.sh --list;tools/loop/*|tools/issues/tests/issue-tooling-selftest.sh;tools/loop/*|tools/mutate.sh --mutations tools/issues/tests/status-mutations.json --list;tools/loop/*|tools/mutate.sh --mutations tools/issues/tests/create-mutations.json --list;tools/loop/*|tools/mutate.sh --mutations tools/issues/tests/close-mutations.json --list;tools/loop/*|tools/mutate.sh --mutations tools/issues/tests/duplicates-mutations.json --list;tools/loop/*|tools/mutate.sh --mutations tools/issues/tests/decision-question-mutations.json --list;tools/sensors/*|tools/issues/tests/issue-tooling-selftest.sh;tools/sensors/*|tools/mutate.sh --mutations tools/issues/tests/status-mutations.json --list;tools/sensors/*|tools/mutate.sh --mutations tools/issues/tests/create-mutations.json --list;tools/sensors/*|tools/mutate.sh --mutations tools/issues/tests/close-mutations.json --list;tools/sensors/*|tools/mutate.sh --mutations tools/issues/tests/duplicates-mutations.json --list;tools/sensors/*|tools/mutate.sh --mutations tools/issues/tests/decision-question-mutations.json --list;tools/sensors/sensors.json|tools/issues/tests/issue-tooling-selftest.sh;tools/sensors/sensors.json|tools/mutate.sh --mutations tools/issues/tests/status-mutations.json --list;tools/sensors/sensors.json|tools/mutate.sh --mutations tools/issues/tests/create-mutations.json --list;tools/sensors/sensors.json|tools/mutate.sh --mutations tools/issues/tests/close-mutations.json --list;tools/sensors/sensors.json|tools/mutate.sh --mutations tools/issues/tests/duplicates-mutations.json --list;tools/sensors/sensors.json|tools/mutate.sh --mutations tools/issues/tests/decision-question-mutations.json --list;tools/loop/evidence-check.sh|bash tools/loop/evidence-check.sh --selftest;tools/loop-spend*|bash tools/loop/tests/loop-spend-selftest.sh;tools/gate-attribute*|tools/loop/tests/loop-selftest.sh --from-git {base};tools/check-rule-routes*|tools/check-rule-routes.sh;tools/check-rule-routes*|tools/tests/check-rule-routes-selftest.sh;tools/check-rule-routes*|tools/mutate.sh --mutations tools/tests/check-rule-routes-mutations.json --list;tools/doc-routes.json|tools/check-rule-routes.sh;tools/doc-routes.json|tools/tests/check-rule-routes-selftest.sh;tools/doc-routes.json|tools/mutate.sh --mutations tools/tests/check-rule-routes-mutations.json --list;tools/tooling.json|tools/check-rule-routes.sh;tools/check-change-readiness*|tools/check-change-readiness.sh --help;tools/check-change-readiness*|tools/tests/check-change-readiness-selftest.sh;tools/check-change-readiness*|tools/mutate.sh --mutations tools/tests/check-change-readiness-mutations.json --list;tools/check-sonar-workflow*|tools/check-sonar-workflow.sh;tools/check-sonar-workflow*|tools/tests/check-sonar-workflow-selftest.sh;.github/workflows/*|tools/check-sonar-workflow.sh;.github/workflows/*|tools/tests/check-sonar-workflow-selftest.sh;sonar-project.properties|tools/check-sonar-workflow.sh;sonar-project.properties|tools/tests/check-sonar-workflow-selftest.sh;tools/ci-vcpkg-cache*|tools/tests/ci-vcpkg-cache-selftest.sh;.github/workflows/*|tools/tests/ci-vcpkg-cache-selftest.sh"
# The steps the gate owes **before** its build and its suites, in the same `<glob>|<command>` shape. A rule the suite
# already owns should reach the child in seconds, not in the gate's tail: a case's first-line `# files:` declaration
# has one reader, `driver#everyCaseDeclaresTheFilesItCanReach`, and on 2026-11-06 #790's attempt passed the 11 cases
# its own `--case` selection owed and was refused by that one twelve minutes into its gate — one path token in a
# comment — and was recorded `blocked` with nothing archived (issue #792; the case alone is 10 s, measured on
# `528d8e2a`). So a delta that writes or narrows a declaration owes it first. Empty for a project whose cheap check
# is already a suite in `LOOP_GATE_SUITES`, and the order is the pair's order here, which is the order the gate reads.
LOOP_GATE_FIRST_STEPS="tools/loop/tests/loop-cases.sh|tools/loop/tests/loop-selftest.sh --case driver#everyCaseDeclaresTheFilesItCanReach"

# The one submodule a fresh worktree does not inherit, if the project has one. Empty for a project with
# none, and read only when the project carries a `.gitmodules` (D4): the path is the project's, not the
# loop's, and no script under `tools/loop/` names one. Three places place it: the fresh worktree's own
# checkout, the kept worktree a run reuses — switching that tree to the new base moves the gitlink and leaves
# the module on the previous branch's pin, which is dirt the run's start refuses under no item (issue #309) —
# and `--reset-worktree`, whose repair has to reach a module a previous build left on another commit, dirt
# `reset --hard` and `clean -fd` do not reach (issue #310).
LOOP_SUBMODULE_PATH="app/src/main/cpp/libosmscout"

# What a kept worktree keeps, and what it loses. The run keeps its worktree so the next run inherits a warm
# *checkout* — the sources and the git state — and not a warm *build*: the module build directories below
# are regenerated by the next build and read by no item, and removing them is what keeps the kept tree from
# growing by gigabytes per run (issue #210: 3.2 GB kept, of which 1.9 GB was `app/build`, on a root
# filesystem at 88 %). The list is this project's, so it lives here and never in a phase; a project with no
# build system records an empty value. `worktree.sh strip-scratch` removes exactly these, only inside
# `$LOOP_WORKTREE`, never following a symlink out of it and never touching a path git tracks, and
# `tools/loop/loop-clean.sh` reports and removes what a tree it was not asked to strip still carries.
LOOP_WORKTREE_SCRATCH_PATHS="app/build auto/build core/build buildSrc/build osmscout-client-java/build"

# What a review round's diff leaves out: one git pathspec, applied as an *exclusion* when the run writes
# `review-<round>.diff`, and named to the reviewer in its own prompt so the absence is never read as a missing
# artefact (issue #204). Empty for a project whose change records carry no generated tree, and then the diff is
# the whole change. Measured (issue #204): item #126's round-3 diff was 435 KB and 9 935 changed lines, of
# which 9 364 (94.3 %) were archived gate HTML and XML against 112 lines of Kotlin; re-measured on the run's own
# file, 10 883 lines with 9 574 of them inside `evidence/`. It excludes a directory tree and not an extension,
# because a `.txt` a reviewer must read can live outside it.
LOOP_REVIEW_EXCLUDE_PATHSPEC=":(exclude,glob)**/evidence/**"
