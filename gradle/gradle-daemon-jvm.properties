#This file is generated by updateDaemonJvm
#
# BUT the toolchainUrl entries below are maintained by hand. updateDaemonJvm
# writes URLs that address a *record* of the foojay Disco index instead — a hash
# id under its v3.0 API — and that index prunes its records: a pruned id answers
# HTTP 400, so Gradle can neither find nor provision a JVM and the build dies at
# daemon start with "Unable to download toolchain ..." before its first task.
# That is how CI broke on 2026-10-06 (gradle/foojay-toolchains#196 — closed
# NOT_PLANNED, "the URL may no longer be valid, so regenerating one is a
# solution"). Re-running the task is therefore a deliberate act, and its freshly
# generated package-id URLs must be replaced by the vendor endpoints below before
# committing; the CI step "Check daemon JVM criteria" fails the run on one.
#
# No toolchainVendor criterion on purpose: any installed JDK 21 satisfies the
# requirement, so a workstation (JBR 21) and the CI runner (Temurin 21) both
# start the daemon from what they already have and download nothing. The URLs
# below serve only a machine that has no JDK 21 at all; they are the vendor's
# permanent endpoint for the required version, not a record id, and
# .../latest/21/ga/... keeps naming the newest 21 GA when a patch is released.
# See guidelines/Build.md, "The build JVM (daemon JVM criteria)".
toolchainUrl.LINUX.X86_64=https\://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse
toolchainUrl.LINUX.AARCH64=https\://api.adoptium.net/v3/binary/latest/21/ga/linux/aarch64/jdk/hotspot/normal/eclipse
toolchainUrl.MAC_OS.X86_64=https\://api.adoptium.net/v3/binary/latest/21/ga/mac/x64/jdk/hotspot/normal/eclipse
toolchainUrl.MAC_OS.AARCH64=https\://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse
toolchainUrl.WINDOWS.X86_64=https\://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jdk/hotspot/normal/eclipse
toolchainUrl.WINDOWS.AARCH64=https\://api.adoptium.net/v3/binary/latest/21/ga/windows/aarch64/jdk/hotspot/normal/eclipse
toolchainVersion=21
