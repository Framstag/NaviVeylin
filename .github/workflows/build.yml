name: Build Debug APK

# Build the debug APK on every change to the main branch and on pull
# requests targeting it. No secrets required — debug signing uses the
# auto-generated debug keystore and every dependency (Android SDK, NDK,
# vcpkg, libosmscout submodule) is public.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs of the same branch/PR to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg is pinned so restored packages stay ABI-compatible (the ABI hash
  # includes the vcpkg tool version). Bump to a newer commit to refresh
  # ports — new ABI versions land in the GitHub Packages NuGet feed and
  # packages rebuild once, then self-heal.
  VCPKG_COMMIT: 94a541197763a4f449a1b91478df48c0584a6256
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  # Compiled vcpkg packages are cached as NuGet packages in the GitHub
  # Packages feed, each versioned by its ABI hash (restore matches per
  # package, so toolchain/runner-image changes rebuild once and the cache
  # self-heals). The old files provider + actions/cache keyed on the
  # manifest hash restored stale archives that vcpkg rejected and never
  # re-saved on a cache hit — a full rebuild on every run.
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/Framstag/index.json,readwrite
  VCPKG_NUGET_REPOSITORY: https://nuget.pkg.github.com/Framstag/index.json
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  # vcpkg must build deps with the SAME NDK as the app (ndkVersion in
  # app/build.gradle.kts) — the runner image pre-sets ANDROID_NDK_HOME to its
  # own NDK (27.3.x), which would otherwise produce mismatched deps.
  ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/27.0.12077973

jobs:
  build:
    name: Build debug APK (all ABIs)
    runs-on: ubuntu-latest
    # packages: write lets the GITHUB_TOKEN push/restore vcpkg binary
    # packages to the GitHub Packages NuGet feed; actions: write is needed
    # by the actions/cache entries for the Android SDK and Gradle caches.
    permissions:
      contents: read
      actions: write
      packages: write
    timeout-minutes: 360
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # AGP reads sdk.dir; setup-vcpkg.sh reads sdk.dir + org.gradle.java.home.
      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          org.gradle.java.home=$JAVA_HOME
          EOF

      # libosmscout must stay platform-independent: no Android logging
      # (android/log.h, __android_log_*, ANDROID_LOG_*) and no Android-only
      # CMake conditionals outside its frozen Android/ directory. The
      # Android/ dir itself is upstream-owned and never modified locally.
      - name: Check libosmscout Android-free outside Android/
        run: |
          set -euo pipefail
          if grep -rE --include='*.cpp' --include='*.h' --include='*.hpp' \
                --include='*.cc' --include='*.c' --include='CMakeLists.txt' \
                --include='*.cmake' \
                'android/log\.h|__android_|ANDROID_LOG|if\(ANDROID\)' \
                app/src/main/cpp/libosmscout \
                | grep -v '^app/src/main/cpp/libosmscout/Android/'; then
            echo "::error::Android-specific code in libosmscout outside Android/"
            exit 1
          fi
          echo "libosmscout is Android-free outside Android/."

      # ── OpenSpec artifact hygiene ─────────────────────────────
      # Two silent-failure classes with no CLI in the runner:
      #   1. a tasks.md that uses bare '1. [x]' items — the parser then reports
      #      0 tasks and the change reads as 'no-tasks' without any error;
      #   2. an operations.*.guidance list entry containing ': ' that is not
      #      quoted — it parses as a YAML mapping, the array fails the
      #      array-of-strings check and the CLI drops that operation's guidance
      #      with only a warning;
      #   3. a capability spec whose '## Purpose' is still the sentence
      #      'openspec archive' writes for a capability it creates — `openspec
      #      validate --type spec` only warns and exits 0, and no delta can
      #      repair it, so nothing else would ever report it (issue §171).
      #      The pass is a `find` over openspec/specs/ because 7 capability
      #      specs sit one level deeper (auto/*, share/*) and a flat glob
      #      cannot see them.
      #      The three classes live in `tools/check-openspec-hygiene.sh` — one home, so this step and the
      #      self-test that breaks each class in a throwaway tree run the same code (issue #45). A class
      #      no case has ever violated is not what guards the artifacts.
      - name: Check OpenSpec artifact hygiene
        run: |
          bash tools/check-openspec-hygiene.sh
          bash tools/check-openspec-hygiene-selftest.sh

      # ── capability classification ──────────────────────────────
      # TODO.md §157 / issue #101: nothing forced a change to classify the capability spec it
      # archives, so the mistake surfaced at the next generation instead. Three instances are on
      # record (generate-feature-list, routing-max-speed, routing-failure-reporting). The tool owns
      # the check, exits 1 naming the id, and reads an open change's delta specs as well as the
      # shipped set — so it fails the pull request that introduces the delta, before the archive,
      # rather than a later session's run. Data only: two files read, no Gradle.
      - name: Check capability classification
        run: |
          set -euo pipefail
          bash tools/gen-feature-list.sh --check-classification || {
            echo "::error file=tools/feature-list/specs.json::a capability spec is unclassified (TODO.md §157) — add its line in the change that introduces it, before the archive"
            exit 1
          }

      # ── feature-list tooling ───────────────────────────────────
      # The gate above is one call of a tool whose 115 cases decide what it reads and refuses. The suite ran
      # nowhere in CI and nowhere in the loop's gate until issue #101: a case that pins the gate's behaviour could
      # pass in isolation and the next change to the tool would learn nothing. Offline, seconds, no Gradle.
      - name: Check feature-list tooling
        run: |
          bash tools/gen-feature-list-selftest.sh

      # ── documentation routes ───────────────────────────────────
      # AGENTS.md's Documentation Map is the only route from "what I am changing" to the guideline
      # section that owns it (the rule and its rationale: guidelines/Build.md §4/§6). A route that
      # points at a section which no longer exists is silent — the reader lands on the wrong part of
      # a correct document — so it is checked here instead of being discovered by whoever follows it.
      # A skill path the documentation names is resolved the same way (`documentation-ownership`,
      # "A document that names a skill resolves to a skill that exists", issue #13), and the check's own
      # self-test runs here because a check nothing runs is the same silence one level down. The mutation
      # set is listed for the same reason as the others: a set that no longer parses fails this step
      # instead of rotting.
      # Text files only: no build, no device, seconds of run time.
      - name: Check documentation routes
        run: |
          bash tools/check-doc-routes.sh
          bash tools/check-doc-routes-selftest.sh
          bash tools/mutate.sh --mutations tools/check-doc-routes-mutations.json --list

      # ── issue tooling ──────────────────────────────────────────
      # The gate for `tools/issues/**`: the Java core's cases and the shell wrappers driven against a stub
      # `gh` on PATH. Offline, no token, no Gradle — and it refuses below JDK 17 with a named message. The
      # surface it protects is the one a later loop trusts (spec `issue-backlog`).
      - name: Check issue tooling
        run: |
          bash tools/issue-tooling-selftest.sh
          # A state transition replaces the item's state, so no call can leave two `status/*` labels on one
          # item (`fix-status-label-replacement`, invariant I16 in `guidelines/Backlog.md` §4). The mutation
          # set's list is printed, as for the other sets: one that no longer parses fails this step instead
          # of rotting. The mutations themselves are not run here — they mutate the tree (`tools/mutate.sh`,
          # change-time, `.pi/skills/mutation-runner`).
          bash tools/mutate.sh --mutations tools/status-mutations.json --list
          # The filing path refuses a merged label set that names two values of one namespace, before any
          # `gh issue create` (`fix-issue-filing-state-namespace`, issue #179). Listed for the same reason as
          # the set above: a mutation set that no longer parses fails this step instead of rotting.
          bash tools/mutate.sh --mutations tools/create-mutations.json --list
          # The closure's settled state (#181, #188): a closed item must read settled whoever closed it, so
          # the status write, its not-planned sibling and the refusal of a rejected write each have a
          # mutation. Listed for the same reason as the sets above.
          bash tools/mutate.sh --mutations tools/close-mutations.json --list
          # The tracker's mechanical hygiene (`sensors-mechanical-hygiene`): the survivor rule, the
          # authorisation rule, the candidate filter and the dedupe marker each have a mutation. Listed for the
          # same reason as the sets above — a set that no longer parses fails this step instead of rotting.
          bash tools/mutate.sh --mutations tools/duplicates-mutations.json --list
          # The question a decision answers (#243): the run's escalation comment opens with its verdict word, so
          # the queue and the answer path read the escalation's `**The decision:**` line instead, and the work
          # package restates that rule. Listed for the same reason as the sets above — a set that no longer
          # parses fails this step instead of rotting.
          bash tools/mutate.sh --mutations tools/decision-question-mutations.json --list

      # ── priority metadata ──────────────────────────────────────
      # The gate for the priority invariant (`issue-metadata-loop`, D7): the profile's bands are total, the
      # marker grammar has one home, neither write path can name the automation opt-in, and every check can
      # be shown red — the last part is what makes the rest a check rather than a claim. Token-free: it reads
      # the profile and the scripts, and never the tracker. The falsification harness's mutations themselves
      # are not run here — they mutate the tree (the run is a change-time step, `task 8`) — but its mutation
      # list is printed, so a harness that no longer parses fails this step instead of rotting.
      - name: Check issue metadata
        run: |
          bash tools/issues/check-metadata.sh
          bash tools/issues/metadata-mutations.sh --list

      # ── agent issue loop ───────────────────────────────────────
      # The gate for `tools/loop/**`: every case drives the real wrapper, worktree, branches, commits,
      # labels and closure in a throwaway git repository, against the stub `gh` (the step above) and a
      # stub `pi`. Offline, no token, no model, no device and no sandbox tool — and it needs nothing
      # the build does not already have (git, jq, JDK 17). Spec `agent-issue-loop`.
      - name: Check agent issue loop
        run: |
          bash tools/loop-selftest.sh
          # The mutation harness's own guards, on a throwaway copy of the engine. The mutations themselves
          # are not run here: they mutate the tree (the loop's falsification run is a change-time step).
          bash tools/loop-mutations-selftest.sh

      # ── loop spend ─────────────────────────────────────────────
      # The analyser behind the `loop-spend` skill reads the children's event streams, so a renamed event field
      # would turn it into a calm zero rather than a failure. Its case set runs on a fixture it writes itself:
      # two items, a worker session with a repeated read and a gate call, a reviewer session. Offline, no token.
      - name: Check loop spend analyser
        run: bash tools/loop-spend-selftest.sh

      # ── backlog references ─────────────────────────────────────
      # Every `§N` a live file cites must still find its entry after `TODO.md` was deleted, and no live
      # line may name that file without citing one — that is the migration's whole justification
      # (`migrate-todo-to-github-issues`, D11). No token here: the recorded `§ → issue` table in the
      # migration's evidence is the record, so the step reads two kinds of text file and nothing else.
      - name: Check backlog references
        run: bash tools/check-todo-references.sh

      # ── sensor tooling ────────────────────────────────────────
      # The gate for `tools/sensors/**`, the three verbs the engine writes through and the sensor
      # pipeline's YAML (spec `backlog-sensors`): every case drives the real engine against the fixture
      # registry, the fixture sensors and the stub `gh` on PATH. Offline, no token, no Gradle, no device —
      # this step grants nothing beyond the read-only contents the workflow already has, which is exactly
      # why the pipeline that can write to the tracker is a separate file (D1). The mutation harness's own
      # list is printed so a harness that no longer parses fails this step instead of rotting; the mutations
      # themselves are not run here — they mutate the tree (the change-time `revert-check` of task 8).
      - name: Check sensor tooling
        run: |
          bash tools/sensor-selftest.sh
          bash tools/sensor-mutations.sh --list

      # The gate for the files the sensor rows declare as their inputs (`tools/build-inputs.sh`,
      # `tools/fetch-build-inputs.sh`): every case drives the real scripts against a throwaway tree with the
      # shared stub `gh` on PATH. Offline, no token, no network, no Gradle. The `--check` line is the bound
      # that keeps a row from declaring a path no pipeline publishes (spec `backlog-sensors`, issue #161):
      # the producer's own manifest is compared with the registry here, before a scheduled run could report
      # four failed checks. The mutation harness's list is printed for the same reason as above — a harness
      # that no longer parses fails here instead of rotting; the mutations themselves are change-time.
      - name: Check the build inputs
        run: |
          bash tools/build-inputs-selftest.sh
          bash tools/build-inputs.sh --check
          bash tools/build-inputs-mutations.sh --list

      # ── portability ────────────────────────────────────────────
      # The gate for `tooling-portability`: no engine under `tools/issues`, `tools/sensors` or `tools/loop`
      # names a project value (the repository, an allowlisted author, a vocabulary value, a path the
      # registry declares, the gate command), and the whole toolchain runs in a synthetic project whose
      # repository, allowlist, vocabulary and bands all differ. Offline, no token, no network, no Gradle:
      # it reads repository files and runs throwaway git repositories, so it needs nothing beyond the
      # `contents: read` the workflow already has. Its check reads the value set from the project's own
      # profile at run time, so the leak is caught on the commit that introduces it.
      - name: Check portability
        run: |
          bash tools/check-portability.sh
          bash tools/check-portability-selftest.sh
          # The mutation runner's own four guards, proven on a toy tree, and the set's list: a mutation set
          # that no longer parses fails this step instead of rotting. The mutations themselves are not run
          # here — they mutate the tree (`tools/mutate.sh`, change-time, `.pi/skills/mutation-runner`).
          bash tools/mutate-selftest.sh
          bash tools/mutate.sh --mutations tools/portability-mutations.json --list

      # ── stale citations ────────────────────────────────────────
      # The gate for `stale-citation-resolution`: one definition of what a citation is (asked by the loop's
      # pre-screen and by the resolver), the repair ladder, the quarantine, the bounds and the idempotence —
      # every case offline in a throwaway repository and against a stub `gh`. The check itself reads the
      # tracker and writes to it, which is why it runs in the sensors pipeline and never here.
      - name: Check stale citation resolver
        run: |
          bash tools/resolve-stale-selftest.sh
          bash tools/mutate.sh --mutations tools/resolve-stale-mutations.json --list

      # ── action runtimes ────────────────────────────────────────
      # A workflow's `uses:` pin carries the runtime: an action major that predates Node 24 makes the
      # runner print a deprecation notice on every step and force the action onto Node 24 anyway
      # (`actions/upload-artifact@v5` declares `runs.using: node20`; five steps warned until issue #240
      # moved them to v7). Nothing else in the tree reads an action version — the workflow parses and the
      # run is green — so the pin is checked here, against the floor table in the checker itself.
      # Text files only: no build, no device, no network.
      - name: Check action runtimes
        run: |
          bash tools/check-action-runtimes.sh
          bash tools/check-action-runtimes-selftest.sh

      # ── Compose sandbox rule ───────────────────────────────────
      # A Compose test class that does not repair the Robolectric sandbox's Compose dispatcher before
      # its Compose rule burns Espresso's 60 s idling budget per case once a non-Compose test has
      # written a Compose state in the same JVM (TODO.md §195, change `fix-compose-sandbox-idle`).
      # The invariant cannot be asserted from inside a test — the class without the rule is exactly
      # the class that fails — so it is checked here. Text files only: no build, no device.
      - name: Check Compose sandbox rule
        run: |
          bash tools/check-compose-sandbox-rule.sh
          bash tools/check-compose-sandbox-rule-selftest.sh

      # ── daemon JVM criteria ───────────────────────────────────
      # gradle/gradle-daemon-jvm.properties is generated by updateDaemonJvm, and
      # the generated file addresses foojay Disco *package records* by id hash.
      # That index prunes records, a pruned id answers HTTP 400, and Gradle then
      # cannot start its daemon at all — that is how this job died on
      # 2026-10-06 (gradle/foojay-toolchains#196). The committed file must
      # therefore carry the vendor's durable endpoints, keep the version, and
      # carry no vendor criterion (so the Temurin 21 installed above satisfies
      # it instead of being excluded). See guidelines/Build.md §2.
      - name: Check daemon JVM criteria
        run: |
          set -euo pipefail
          f=gradle/gradle-daemon-jvm.properties
          [ -f "$f" ] || { echo "::error file=$f::missing"; exit 1; }
          if grep -nE 'api\.foojay\.io/disco/v3\.0/ids/[0-9a-f]{16,}' "$f"; then
            echo "::error file=$f::addresses a foojay package id — replace it with the vendor's durable endpoint for version 21 (guidelines/Build.md §2)"
            exit 1
          fi
          if ! grep -q '^toolchainVersion=21$' "$f"; then
            echo "::error file=$f::toolchainVersion=21 is missing — the daemon JVM stays pinned to 21"
            exit 1
          fi
          if grep -q '^toolchainVendor=' "$f"; then
            echo "::error file=$f::a vendor criterion excludes the JDK this job installs — drop it (guidelines/Build.md §2)"
            exit 1
          fi
          if grep -nE '^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=' gradle.properties; then
            echo "::error file=gradle.properties::the versioned property source must carry no org.gradle.java.home — a machine-local absolute path selects no JVM where the criteria apply and is wrong on every other machine; delete the line (guidelines/Build.md §2, issue #91)"
            exit 1
          fi
          # The build logic compiles with the daemon JVM the criteria select, so it must declare no toolchain of
          # its own: buildSrc has no settings.gradle.kts, the foojay resolver the root settings applies never
          # reaches its build, and a toolchain it cannot auto-detect fails the configuration of the whole build
          # before its first task (issue #92). The `sed` strips `//` comments, so the file may explain the rule it
          # must not violate, and the case `BuildSrcJvmRequirementTest` asserts the same absence on the host.
          f=buildSrc/build.gradle.kts
          [ -f "$f" ] || { echo "::error file=$f::missing"; exit 1; }
          if sed 's|//.*||' "$f" | grep -nE 'toolchain|languageVersion|JavaLanguageVersion'; then
            echo "::error file=$f::buildSrc must declare no JVM toolchain of its own — a toolchain it cannot provision fails the configuration on a machine without that JDK; it compiles with the daemon JVM the criteria select (guidelines/Build.md §2d, issue #92)"
            exit 1
          fi
          echo "daemon JVM criteria: version 21, no vendor, no package id, no buildSrc toolchain."

      # ── Android SDK ──────────────────────────────────────────
      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v5
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-api36-bt36-ndk27-cmake3221

      - name: Install Android SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          # sdkmanager exits 0 after writing licenses; 'yes' then dies on the
          # closed pipe (SIGPIPE → 141). Under `set -o pipefail` that fails the
          # step — swallow it, sdkmanager's own exit code already ran.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      # ── the graph a JVM-only test run asks for ─────────────────
      # The licence inventory is a variant asset source, so the unit-test graph carried the SBOM and
      # licence chain and a tree without a vcpkg checkout could not configure `./gradlew test` at all
      # (issue #270, spec `build-sbom` — "A JVM-only test run does not require the native tree"). The
      # three --dry-run probes need no vcpkg tree, no build and no network, and they run while this tree
      # still has no vcpkg checkout — the tree the item was measured in.
      #
      # The step needs the *Android SDK*: a probe configures `:app`, so a tree whose `sdk.dir` names no
      # installed, licensed SDK fails at configuration before the absence of vcpkg can matter — for five
      # runs (2026-10-25) this step sat above 'Install Android SDK' and every probe died with
      # `LicenceNotAcceptedException` while the self-test's failure text printed no Gradle output at all
      # (issue #198). It therefore belongs below that step, and above 'Clone vcpkg'.
      - name: Check the JVM-only test graph
        run: bash tools/check-jvm-test-graph-selftest.sh

      # Host build tools required by vcpkg host deps: gperf:x64-linux (used by
      # fontconfig) builds via autotools. Without these, fontconfig → cairo →
      # pango all fail and the .pc gate reports them missing.
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          # mono-complete: vcpkg's NuGet binary cache runs nuget.exe under
          # mono; ubuntu-24.04/latest runners no longer preinstall mono
          # (actions/runner-images#10636).
          sudo apt-get install -y autoconf autoconf-archive automake libtool mono-complete

      # ── vcpkg ────────────────────────────────────────────────
      - name: Clone vcpkg (pinned commit)
        run: |
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD

      - name: Bootstrap vcpkg
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # vcpkg binary cache: built packages are stored as NuGet packages in
      # the GitHub Packages feed (nuget.pkg.github.com/Framstag), each
      # versioned by its ABI hash. A runner-image/toolchain update produces
      # new ABI versions — exactly one rebuild, then the cache self-heals;
      # dependency-list/overlay edits only rebuild the affected ports. The
      # token is written to the runner-local user NuGet config (outside the
      # checkout); the runner is ephemeral and destroyed after the job.
      - name: Configure NuGet source for vcpkg binary cache
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUGET_EXE=$("$VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)
          mono "$NUGET_EXE" sources add \
            -ConfigFile "$HOME/.config/NuGet/NuGet.Config" \
            -Source "https://nuget.pkg.github.com/Framstag/index.json" \
            -StorePasswordInClearText \
            -Name GitHubPackages \
            -UserName "Framstag" \
            -Password "$NUGET_TOKEN"
          mono "$NUGET_EXE" setapikey "$NUGET_TOKEN" \
            -ConfigFile "$HOME/.config/NuGet/NuGet.Config" \
            -Source "https://nuget.pkg.github.com/Framstag/index.json"

      # Installs all deps for the 3 Android triplets; compiled packages
      # come from / are stored in the NuGet binary cache.
      - name: Install vcpkg dependencies
        run: ./setup-vcpkg.sh

      # setup-vcpkg.sh tolerates per-package failures (|| echo) — fail the
      # job here if any required package is actually missing.
      - name: Verify vcpkg packages
        run: |
          set -euo pipefail
          for pc in cairo marisa pango harfbuzz fribidi libpng freetype2 fontconfig protobuf libxml-2.0 zlib; do
            found=false
            for t in arm64-android arm-neon-android x64-android; do
              if [ -f "$VCPKG_ROOT/installed/$t/lib/pkgconfig/$pc.pc" ]; then
                found=true
              fi
            done
            if [ "$found" != true ]; then
              echo "::error::Missing vcpkg package: $pc"
              exit 1
            fi
          done
          echo "All vcpkg packages present for all triplets."

      # ── Gradle build ─────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # This flag does NOT select the daemon JVM: the checked-in daemon JVM
      # criteria (gradle/gradle-daemon-jvm.properties) take precedence over
      # org.gradle.java.home and JAVA_HOME (Gradle 9.6.1, "Daemon JVM
      # Toolchains"). They pin version 21 with no vendor, so the daemon starts
      # on the Temurin 21 installed in "Set up JDK 21" without a download. The
      # flag stays for the launcher JVM and so the recipes match a workstation,
      # and the local.properties line stays: setup-vcpkg.sh reads the JDK
      # path from local.properties. The versioned gradle.properties carries no
      # org.gradle.java.home line (issue #91).
      #
      # ~/.gradle/jdks is cached above because that is where Gradle unpacks a
      # provisioned JDK; with the criteria as they are, nothing is provisioned
      # on this runner, and the cache only saves the download if a criteria
      # change ever forces one.
      - name: Build debug APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleMobileDebug

      # SBOM for the debug build (CycloneDX JSON: JVM deps + native vcpkg
      # tree + libosmscout submodule SHA, task :app:generateSbomMobileDebug).
      # Reuses the vcpkg dependency tree and cache set up above — the CLI is
      # downloaded once by Gradle into the build dir.
      - name: Generate debug SBOM
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:generateSbomMobileDebug

      # License policy gate: every component of the SBOM must resolve to an
      # identifier that licenses/license-policy.json permits for its
      # distribution scope. Fails the run on a missing, unresolved or
      # disallowed license. The gate reads the generated SBOM, so it validates
      # the artifact that ships. Warnings name licenses that still need the
      # application license decision.
      - name: Check license policy
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:checkLicensePolicy

      # Unit tests across all modules (app mobile + automotive, auto, core,
      # osmscout-client-java). Runs on the host JVM via the JNI stub — no
      # device/emulator needed. Catches test-source breakage that the APK
      # build alone misses (e.g. fakes drifting from OSMScoutClient API).
      # Same task set and same forcing rule as the documented full gate
      # (guidelines/Build.md §3, change `speed-up-build-test-gate`): `-PforceTests`
      # makes the test tasks execute, `--no-build-cache` keeps a warm cache from
      # answering with a previous run's outputs. The timing init script is what
      # `build-duration` watches: it records this invocation's wall time at
      # `build/gate-timings.json`, the path the row declares (issue #161).
      # `-PjvmTestsOnly` is what the local gate passes too (tools/loop/loop.conf):
      # a JVM-only run reads no licence inventory, so the SBOM/licence chain stays
      # out of the test graph (spec `build-sbom`, "A JVM-only test run does not
      # require the native tree", issue #270). The strict artefact path is the
      # three steps above, which run with the vcpkg tree present.
      - name: Run unit tests
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -I tools/gate-timings.init.gradle.kts test -PforceTests -PjvmTestsOnly --no-build-cache

      # A green verdict says nothing about what ran: name the suites and their
      # tallies in the log, per module and per `:app` flavor.
      - name: Report executed test suites
        run: |
          for d in app/build/test-results/testMobileDebugUnitTest app/build/test-results/testAutomotiveDebugUnitTest \
                   auto/build/test-results/testDebugUnitTest core/build/test-results/testDebugUnitTest \
                   osmscout-client-java/build/test-results/test; do
            echo -n "$d: "
            awk -F'"' '/testsuite /{t+=$4;f+=$8;e+=$10;c++} END{printf "%d classes, %d tests, %d failures, %d errors\n", c, t, f, e}' "$d"/TEST-*.xml 2>/dev/null || echo "no result XML"
          done

      # ── the gate's artifacts, measured ─────────────────────────
      # Two shipped requirements of `build-test-gate` that a task list alone cannot settle (issue #45,
      # TODO.md §17): `-PforceTests` has to make the test tasks execute while leaving the module compile
      # up to date, and the unit-test asset APK has to follow the merged assets — a Robolectric case that
      # reads a packaged asset reads that APK, so a stale one makes the case lie. The step moves one icon
      # out of the submodule's raster leaf, restores it, and needs what the steps above already provided:
      # the vcpkg tree (the licence inventory is a variant asset source) and the SBOM CLI.
      - name: Check the gate's artifacts
        run: bash tools/check-gate-artifacts-selftest.sh

      # Code coverage (report-only, no gate): root Kover tasks merge
      # app/auto/core unit-test coverage into one HTML+XML report; the
      # pure-Java osmscout-client-java module is measured by its own JaCoCo
      # reports, one per provenance — its local overrides and the vendored
      # libosmscout client API it compiles beside them (issue #678). The
      # per-module Kover XML reports are named as well, because the sensor
      # registry measures one percentage per module and the merged report
      # cannot be split back into its modules (`tools/build-inputs.sh`).
      # One invocation, so the test tasks behind all of them run once.
      - name: Generate coverage reports
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :koverHtmlReport :koverXmlReport :app:koverXmlReport :auto:koverXmlReport :core:koverXmlReport :osmscout-client-java:jacocoTestReport :osmscout-client-java:jacocoVendoredTestReport

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            build/reports/kover/**
            osmscout-client-java/build/reports/jacoco/**
          if-no-files-found: error

      # ── the sensor rows' inputs ────────────────────────────────
      # The one step that publishes the files the sensor rows declare (spec `backlog-sensors`,
      # `tools/build-inputs.sh`, issue #161). `if: always()`: a red build is exactly when the checks'
      # pipeline needs the result record, and the publisher writes that first, then names whatever else it
      # cannot produce. A red test run explains the missing coverage summary — Kover's report task is
      # skipped once the tests failed — and the step fails visibly instead of uploading a quiet hole.
      - name: Publish the sensor inputs
        if: always()
        run: bash tools/build-inputs.sh --write

      # The record, as one artifact carrying exactly the declared paths, so the checks' pipeline restores
      # them where the rows look for them. `if: always()` for the same reason: the partial record of a red
      # build still carries the result record `broken-main` reads.
      - name: Upload the sensor inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sensor-inputs
          path: |
            build/gate-timings.json
            app/build/reports/jacoco/coverage.json
            app/build/gate-result.json
            app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: naviveylin-debug-apk
          path: app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: naviveylin-sbom
          path: app/build/outputs/sbom/mobileDebug/bom.json
          if-no-files-found: error

      # Generated license data as packaged into the app: the dependency list
      # with identifiers, distribution scopes and evidence. Uploaded so a
      # reviewer can read the license inventory without unpacking the APK.
      - name: Upload license inventory
        uses: actions/upload-artifact@v7
        with:
          name: naviveylin-license-inventory
          path: app/build/generated/assets-licenses/mobileDebug/licenses/**
          if-no-files-found: error
