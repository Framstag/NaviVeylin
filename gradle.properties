# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# JVM target
kotlin.jvm.target=17

# Java home for Gradle daemon (AGP 8.7+ requires Java 17+)
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk

# Enable Compose
android.defaults.buildfeatures.compose=true

# AGP 9.0 built-in Kotlin: allow Kotlin source sets (KGP-style, needed by KSP).
# The option is experimental; the AGP warning is suppressed below.
android.disallowKotlinSourceSets=false

# Suppress AGP warning for the experimental option above.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
