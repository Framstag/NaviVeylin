# tools/loop/loop.conf — the loop's recorded run defaults, and the three keys that are this project's.
#
# The loop's engine is portable: the queue, the worktree, the phases, the gate discipline, the stop
# conditions and the report name no skill, no command and no project value. Everything that IS this
# project's lives here, and nowhere else (design D16). A second project edits this file and
# `tools/tooling.json`; it never edits a phase or a prompt skeleton. Which value of the profile's
# namespaces each of the loop's decisions means lives in the profile's `roles` section, read through
# `lib.sh`'s `loop_role` and enforced by the portability check.
#
# Sourced by `tools/loop/lib.sh` (and through it by every script and prompt renderer). Override the
# whole file with `LOOP_CONF=<path>`, which is what the loop self-test does to prove the seam.

# ── the budget defaults (D2) ─────────────────────────────────────────────────────────────────────
# Every flag `run.sh` accepts is recorded here, and an omitted flag takes this value: a script cannot
# ask, so the budget is a file plus arguments rather than a dialogue.
LOOP_ITEMS_DEFAULT=3
LOOP_MINUTES_DEFAULT=90
LOOP_REVIEW_DEFAULT=on
LOOP_MAY_CLOSE_DEFAULT=yes
LOOP_MAX_DECISIONS_DEFAULT=10
# The ceiling of open `agent/needs-decision` items that refuses a run before it starts. It was 3 until
# 2026-10-20, when a single day of runs left seven open decisions behind — each a question worth asking, none
# of them answered yet — and the next run would have refused to start for a reason that is the owner's backlog
# rather than a fault of the run. A run that keeps working while decisions accumulate is the point: the pile is
# read by `tools/issues/decisions.sh`, not by refusing to work.
# How many review rounds one item gets. The budget is a recorded value like every other one: a project that
# reviews harder raises it here rather than editing the phase (issue #187).
LOOP_MAX_REVIEW_ROUNDS_DEFAULT=2
# Whether a difference in the project's own tree decides an item. `off` records it — the paths that changed and
# the processes standing in the project but outside the worktree — and lets the item keep the outcome its work
# earned; `on` blocks the item (and discards the review round) as the loop did until 2026-10-23. It is `off`
# because the comparison measures a tree the run does not own: 5 of 139 items across four runs were blocked by it,
# and in the three cases of 2026-10-23 (#274, #276, #285) the child had written nothing there — every write target
# in the three transcripts lay under `.pi/worktrees/loop/` or the item's evidence directory. The run's own
# landings fast-forward the base in the project tree (`worktree.sh merge-item`), and a peer session writes it too,
# so two readings of it are not evidence about one child. Turn it on for a tree that is exclusive.
LOOP_STRICT_OUTSIDE_WRITE_DEFAULT=off
# The floor below which the remaining time cannot pay for the next item, and the LOWER BOUND of the floor
# `next` derives: the run measures what its items cost (`done --wall`), so `next` takes the median of the
# finished items' wall times, multiplies it by the 1.5 spread the measurements show, rounds it up, and
# never goes below this value. The constant therefore decides a run with no history or with a cheap one
# (a run of skips), and a refusal names both numbers it compared (issue #206). Measured: 40-65 min for a
# change, 10-15 min for a gated-out skip, 100 min for #126 — `.pi/skills/fix-loop/REFERENCE.md`, "Measured
# costs".
LOOP_ITEM_FLOOR_MINUTES=45
# How long one child process may run before the run ends it, in seconds (2700 = 45 min). `--minutes` bounds
# the run; this bounds one child inside it, and it is a recorded value for the same reason the others are —
# it is a fact about the host, not about a phase. Measured 2026-10-19: one item's worker phase ran 83 min
# inside a single wait, and the run's deadline, which is consulted only between items, never fired. A child
# that outlasts this is ended with everything it started, its report carries `LOOP-TIMEOUT: …`, and the item
# is recorded `blocked` with that transcript rather than spent (issue #203).
LOOP_CHILD_MAX_SECONDS=2700
# The floor below which this host may not start an item, in MiB of available memory (`MemAvailable`, read from the
# file `LOOP_MEMINFO_PATH` names). Below it the item is recorded `blocked` with the measurement and the floor it
# was compared against, and the run stops: a run on a starved host cannot become productive by taking the next
# item. Measured 2026-10-19 (issue #209): item #126's gate hit **194 MB free RAM and 18 GB swap** and spent 30 min
# inside `:app:kspMobileDebugUnitTestKotlin`; the same 5 680 tests took **3m47s** on a quiet host. Measured on the
# same host during a run: 15 668 MB total, 13 168 MB used, **467 MB free**, 2 499 MB available, swap 13 915 MB of
# 37 887 MB — Firefox 7 600 MB, VS Code's Java language server 2 282 MB across three JVMs, Gradle/Kotlin daemons
# 1 625 MB, VS Code UI 885 MB, `cpptools` 407 MB, and the loop's own children 649 MB. The loop was the smallest
# consumer and the one that failed, and its `wallSeconds` measured the desktop session. 1024 MiB is the floor
# because a Gradle gate plus its daemons needs more than that to finish inside `LOOP_CHILD_MAX_SECONDS`. `0`
# disables the check.
LOOP_MIN_FREE_MIB=1024
# Where this host publishes the memory it has available: `MemAvailable:` in this file, in kB, divided to MiB and
# compared against `LOOP_MIN_FREE_MIB` before an item's first child is started. A host that has no such file — a
# container without procfs, or a platform that keeps the number elsewhere — makes the check pass, because a check
# that cannot be made is not a refusal and the engine must run there too. Empty is the same as an absent file.
# The key exists so the self-test can point the reading at a file of its own, and so a host that publishes the
# number somewhere else records it here rather than in a phase.
LOOP_MEMINFO_PATH="/proc/meminfo"

# Where `state.sh init` keeps the state it replaces, so a finished run's counters, verdicts and stop reason
# survive the next run starting (issue #207). Empty means `runs/` beside the state file — derived from the
# state, so the engine still names no project path. A project that archives elsewhere records the directory
# here; a relative value is relative to the project root. Archives are machine-local like the state itself:
# they live under `.pi/`, which is gitignored, and they are never committed.
LOOP_RUNS_DIR=""

# Where the loop's tooling puts throwaway trees. The self-test creates one `<prefix><random>` tree per suite
# under it, and `tools/loop/loop-clean.sh` reports and removes the ones a suite killed with `SIGKILL` left
# behind — a trapped signal is cleaned up by the suite itself, and `kill -9` cannot be trapped. Empty means
# `.pi/tmp` under the project root, which is gitignored; a relative value is relative to the project root.
# Measured 2026-10-20 (issue #210): 90 MB across four `loop-selftest.*` trees, every one of them from a suite
# that was killed.
LOOP_TMP_DIR=""
# How old a tree under `LOOP_TMP_DIR` must be before `loop-clean` treats it as left behind rather than as a
# suite that is writing into it right now. Only the age can tell the two apart — a killed suite leaves no
# lock that outlives it — so this is a host fact with a wide margin, recorded here and not in the engine.
LOOP_TMP_STALE_MINUTES=120
# How many cases the self-test runs at once. Every case owns a throwaway repository, a scratch tree of its own and a
# process group of its own, and they share nothing but the read-only engine, so the suite is bounded by the host
# rather than by the cases: measured 2026-10-22 (issue #260), 163 cases ran strictly one after another and took
# 723 s. Empty means the host's CPU count (`nproc`, else `getconf _NPROCESSORS_ONLN`); a value set here bounds a
# host whose timing-sensitive cases want fewer, and `tools/loop-selftest.sh --jobs <n>` bounds one invocation.
LOOP_SELFTEST_JOBS=""
# How long one case of the self-test may run before the suite ends it (issue #308). A bound per case, not per suite:
# measured 2026-10-25, a case that never returned held the suite — and the gate behind it — for **56 minutes**, the
# worker that ran that gate was then ended by its own `LOOP_CHILD_MAX_SECONDS`, and the item it was working on was
# left with uncommitted work. The suite's slowest case is 9–15 s and all 223 cases together took 273 s the same day,
# so the default is 60× the slowest case; a case that needs more raises this key. Empty, non-numeric or `0` is the
# default rather than a refused suite. What the bound ends is the case's process group, and the line it prints names
# the case and the bound (`FAIL <case> (exceeded <n> s)`).
LOOP_CASE_MAX_SECONDS=900

# ── the project-specific keys (D16) ───────────────────────────────────────────────────────


# The one gitignored directory a stopped run copies into `<item dir>/leftover-from-killed-run.patch` instead of only
# naming it (issue #308): this project's unarchived changes live under `openspec/changes/*/`, which is gitignored, and
# an unarchived change is exactly the work a killed worker leaves behind — `git status` does not show it, so a patch
# of the tracked diff alone would keep the code and lose every artifact that proves it. Measured 2026-10-25: the item
# whose gate hung was reconstructed by hand from `git status` and a diff for exactly that reason. Every other ignored
# path is *named* in the patch's header rather than copied, so no build directory lands in it, and so is any file
# above the patch's size bound. Empty means no ignored path is copied. Relative to the project root.
LOOP_UNTRACKED_RECORD_DIR="openspec/changes"

# How a child process is started — the ONE indirection through which every agent process is started
# (D3). A future sandbox change sets this to an `sbx exec …` invocation and touches nothing else.
#
# The value names *this project's* adapter with the agent as its argument, and the path is relative to the
# project root exactly as `LOOP_GATE_CMD` is (the run starts every child there). The adapter is outside the
# engine on purpose: it is where `--mode json` lives, so no script under `tools/loop/` names an agent command
# or a mode flag, and a second project points this key at its own adapter or at its own plain-text command.
# What the adapter does with the stream, and why the stream matters, is `tools/pi-child-events.sh`.
LOOP_AGENT_CMD="bash tools/pi-child-events.sh pi"

# Which of this project's skills the worker is told to use. The worker prompt skeleton carries a
# placeholder; these names are substituted into it at render time.
LOOP_WORKER_SKILLS="openspec-propose openspec-apply-change build-app run-tests revert-check"

# How this project's gate is run. Empty for a project with no build system: the phases still run and
# the report says the gate was skipped, because the gate is the project's, not the loop's. The invocation is
# the one this host completes: measured 2026-10-19, the same 5680 tests took **3m47s** through
# `-PforceTests --no-build-cache` and *never reached a suite* through `--rerun-tasks` (30 min inside
# `:app:kspMobileDebugUnitTestKotlin` at 194 MB free RAM and 18 GB swap). The flag table and the reason are
# `guidelines/Build.md` §4 and `.pi/skills/run-tests`; the gate is run **once** per item, and a gate that
# outlasts `LOOP_CHILD_MAX_SECONDS` blocks the item instead of being retried (issue #203).
LOOP_GATE_CMD="./tools/loop/gate.sh"

# The one command that answers what a change's pathspec owes and what numbers its evidence already carries — the
# worker is handed it as `{{MEASURE_CMD}}`, and it is a reading command: it runs no check, because the gate above
# is run once per item. Measured (issue #246, `.pi/issue-loop/items/{69,133,11,13,98}/events.jsonl`): an item
# spends 73 to 244 shell calls and 22 to 79 file reads, one model turn each, against 2 s to 575 s of tool time in
# 291 s to 1 644 s of wall clock — so the facts a worker needs before it plans belong to one call's output rather
# than to a walk of the tree. Empty for a project with no such command: the prompt then says so instead of naming
# a path that is not there.
LOOP_MEASURE_CMD="./tools/loop/measure.sh"

# The one command that prints the project's declared test cases, one per line, **without running one** — the
# measuring block carries its count, so a change quotes the suite's size from a command rather than counting cases
# by hand. Measured (issue #244, `.pi/issue-loop/items/*/reviewer-report-1.md`, 2026-10-21): 147 `UNPROVEN` claims
# in the round-1 reports, a change asserting "the existing 148 shell cases" where the tree held 130 and the base
# 128. It is a reading command like the one above, and the profile owns it because the suite's name and its
# listing flag are the project's. Empty for a project whose suite cannot list its cases: the block then says so
# instead of reporting a count of zero.
LOOP_SUITE_CASES_CMD="tools/loop-selftest.sh --list"

# **The branch every item descends from** — the run records this branch's commit as the base, and the landing step
# merges back into it (issue #301). It is a key here because it is a name of *this project's*: a project whose base
# branch is `trunk` or `develop` records it here and edits no engine (issue #303). The value is written as a
# fill-if-unset expansion because this file is sourced **after** the environment (`lib.sh`'s `loop_resolve`), so a
# plain assignment would silently ignore an inherited `LOOP_BASE_REF` — as written, the environment wins and an unset
# environment takes the branch recorded here. The engine's own default (`main`) stays as the fallback for a
# configuration that records none, which is the only case in which it is read.
LOOP_BASE_REF="${LOOP_BASE_REF:-main}"

# The gate a delta owes is the one its pathspec asks for (issue #242): `./gradlew test` alone let a landing pass
# in the run and break `tools/check-portability-selftest.sh` in the pipeline, which reddened `main` on
# 2026-10-21. `gate.sh` reads the keys below and runs what the change touches: the build's own gate when a
# compiled path changed, and the shell commands of the pipeline's check steps that read the touched paths
# otherwise. `Build.md` §2 states the rule; these lines are this project's mapping of it, which is why they live
# in the profile and not in the engine — and the map is only as wide as its *command* side: every `bash`/`sh`
# command a `Check …` step runs is a value of `LOOP_GATE_SUITES`, but which *paths* a step reads is derivable from
# no workflow (`design.md`), so a path a check reads but names is a residual the map cannot close (issue #242).
#
# A compiled path is one a tree the build reads holds, or one whose name is the convention for a build input, so
# the patterns below name *where* a path sits or *which* build input it is — `Build.md` §2a's scope block already
# says `*.md`, `openspec/**`, `.pi/**`, `guidelines/**` and `tools/**` are no compiled file. A basename pattern
# read an archived evidence tally as compiled: `*.xml` matched
# `openspec/changes/archive/<x>/evidence/gate-tallies/a.xml`, so a delta that touches no compiled file owed
# `./gradlew test -PforceTests --no-build-cache` for an archive commit whose diff carried four evidence XMLs — the
# same tree owed the three shell suites, `tests=202 failures=0`, before that commit and the Kotlin suite after it
# (measured 2026-10-23, issue #273; the item reports 13 min 15 s, its log carries the tally and no duration). Two
# other trees carried the same false positive: the `tools/fixtures/` `.xml` that mimic test reports, and
# `tools/issues/core/*.java`, which the shell suites compile with `javac`.
# `*/src/*` is a module's source tree whatever the module is called, so a module added later is gated without
# this line being edited; `*/lint.xml` is a module's lint configuration, which the build reads. A Gradle script and
# a toolchain `.toml` stay name-based because their names are the convention — which also gates a Gradle init
# script beside the build (`tools/gate-timings.init.gradle.kts`) and the root `hmm_mise.toml`; `*.gradle` matches
# no file today. Neither name-based pattern reaches an evidence tally or a fixture (issue #273, round 2).
LOOP_GATE_TALLY_DIR="app/build/test-results/loop-gate"
# `-PjvmTestsOnly` is passed because the gate is a JVM-only run: the licence inventory is a variant asset
# source, so without it the unit-test graph carries `generateLicenseAssets` → `generateSbom` →
# `mergeNativeSbom` and a tree without a vcpkg checkout cannot configure the suite at all (issue #270, spec
# `build-sbom` — "A JVM-only test run does not require the native tree"). The strict artefact path is still
# covered, by the CI steps that assemble and generate the SBOM with the vcpkg tree present.
LOOP_GATE_COMPILED_CMD="./gradlew test -PforceTests -PjvmTestsOnly --no-build-cache"
LOOP_GATE_COMPILED_PATTERNS="*/src/* */lint.xml *.gradle.kts *.gradle *.toml CMakeLists.txt"
# The pipeline the map below is pinned to: the workflow whose `Check …` steps are the gate's steps, so every
# `bash`/`sh` command one of them runs has to be a value of the map. `gate#theMapCoversEveryPipelineStep` is the
# pin — it fails naming each command the map is missing — so a new pipeline step is a red loop suite instead of a
# red `main`. The pin reads a step's `run:` line that names a script and nothing else: a step whose check is inline
# shell or a Gradle task is outside it (`Check daemon JVM criteria` over `gradle/gradle-daemon-jvm.properties`),
# and so is a path a check reads without naming (§242's residual). Empty for a project with no pipeline: the map
# is then a copy with no alarm.
LOOP_GATE_PIPELINE=".github/workflows/build.yml"
# The map's unit is a pipeline *step*, but a path carries the commands of the tool it names, not necessarily all
# of the step: a tool's check, its self-test and its mutation list are carried together (`tools/build-inputs*`
# offers all three), while a step's other commands are carried by the paths of their own tools, because the
# pipeline runs the step as a unit and any of its commands can be the one that reddens.
#
# The classification pair is the project's own reading of the same rule, and it is here for the reason this key
# exists: an `openspec/` path — the delta a change writes, and the archive move that ships it — owes the gate that
# names an unclassified capability, and the tool's suite is what proves the gate reads both sets (issue #101).
#
# The last two pairs are the *records* of the loop's mutation set against the lines they quote (issue #264). The
# harness's own cases were the gate for `tools/loop-mutations.sh`, and they prove the harness can report a record
# that no longer matches; nothing applied the declared records to the files they name, so `9.9` and `12.2` named a
# `run.sh` line that #227 had replaced and no gate noticed. It is owed for an engine path — the edit that orphans a
# record is an edit to the file the record quotes — and for the set itself. The full set stays a hand-run before a
# change that owns `tools/loop/**` is archived — 84 records × two case runs is the 21-minute pass of issue #235,
# which is why the bound exists — while this check reads the whole declared set in the time of 84 `sed` calls.
#
# The first pair carries `{base}`: the loop's self-test owes the cases the delta's own files declare, not the whole
# set. The token is the gate's (`gate.sh` replaces it with the base it resolved, from the same diff it computed the
# paths from), so nothing here restates the paths, and `--from-git` is the filter the harness's records already use.
# Measured 2026-10-23 (issue #276): the set is 190 cases and 723 s, and a delta under `tools/loop/` touches a file a
# handful of them declare. The whole set is still owed before a change that owns `tools/loop/**` is archived.
#
# The `--from-git {base}` suffix is the gate's own narrowing, not part of the pipeline command, so the pin strips
# it before comparing: the map value names the command the pipeline runs, with the gate's filter appended.
LOOP_GATE_SUITES="tools/loop/*|tools/loop-selftest.sh --from-git {base};tools/loop/*|bash tools/loop-mutations.sh --check;tools/loop-cases.sh|tools/loop-selftest.sh --from-git {base};tools/loop-mutations.sh|tools/loop-mutations-selftest.sh;tools/loop-mutations.sh|bash tools/loop-mutations.sh --check;tools/loop-mutations-selftest.sh|tools/loop-mutations-selftest.sh;tools/loop-selftest.sh|tools/loop-selftest.sh --from-git {base};tools/loop-selftest.sh|bash tools/loop-mutations.sh --check;tools/mutate*|tools/mutate-selftest.sh;tools/issues/*|tools/issue-tooling-selftest.sh;tools/issues/*|tools/issues/check-metadata.sh;tools/issues/*|tools/issues/metadata-mutations.sh --list;tools/tooling.json|tools/issue-tooling-selftest.sh;tools/issue-tooling-cases.sh|tools/issue-tooling-selftest.sh;tools/status-mutations.json|tools/mutate.sh --mutations tools/status-mutations.json --list;tools/create-mutations.json|tools/mutate.sh --mutations tools/create-mutations.json --list;tools/close-mutations.json|tools/mutate.sh --mutations tools/close-mutations.json --list;tools/duplicates-mutations.json|tools/mutate.sh --mutations tools/duplicates-mutations.json --list;tools/decision-question-mutations.json|tools/mutate.sh --mutations tools/decision-question-mutations.json --list;tools/sensors/*|tools/sensor-selftest.sh;tools/sensor-*.sh|tools/sensor-selftest.sh;tools/sensor*|tools/sensor-mutations.sh --list;.github/workflows/sensors.yml|tools/sensor-selftest.sh;.github/workflows/sensors.yml|tools/sensor-mutations.sh --list;tools/build-inputs*|tools/build-inputs.sh --check;tools/build-inputs*|tools/build-inputs-selftest.sh;tools/build-inputs*|tools/build-inputs-mutations.sh --list;tools/check-portability*|tools/check-portability.sh;tools/check-portability*|tools/check-portability-selftest.sh;tools/check-portability*|tools/mutate.sh --mutations tools/portability-mutations.json --list;tools/portability-*|tools/check-portability.sh;tools/portability-*|tools/check-portability-selftest.sh;tools/portability-*|tools/mutate.sh --mutations tools/portability-mutations.json --list;tools/fixtures/foreign-project/*|tools/check-portability-selftest.sh;PORTING.md|tools/check-portability-selftest.sh;tools/resolve-stale*|tools/resolve-stale-selftest.sh;tools/resolve-stale*|tools/mutate.sh --mutations tools/resolve-stale-mutations.json --list;tools/check-action-runtimes*|tools/check-action-runtimes.sh;tools/check-action-runtimes*|tools/check-action-runtimes-selftest.sh;.github/workflows/*|tools/check-action-runtimes.sh;.github/workflows/*|tools/check-action-runtimes-selftest.sh;tools/check-compose-sandbox-rule*|tools/check-compose-sandbox-rule.sh;tools/check-compose-sandbox-rule*|tools/check-compose-sandbox-rule-selftest.sh;app/src/test/*|tools/check-compose-sandbox-rule.sh;app/src/test/*|tools/check-compose-sandbox-rule-selftest.sh;tools/gen-feature-list*.sh|tools/gen-feature-list-selftest.sh;tools/feature-list/*|tools/gen-feature-list-selftest.sh;openspec/*|bash tools/gen-feature-list.sh --check-classification;tools/check-doc-routes*|tools/check-doc-routes.sh;tools/check-doc-routes*|tools/check-doc-routes-selftest.sh;tools/check-doc-routes*|tools/mutate.sh --mutations tools/check-doc-routes-mutations.json --list;*.md|tools/check-doc-routes.sh;*.md|tools/check-doc-routes-selftest.sh;*.md|tools/mutate.sh --mutations tools/check-doc-routes-mutations.json --list;*.md|tools/check-todo-references.sh;tools/check-todo-references*|tools/check-todo-references.sh;openspec/*|tools/check-doc-routes.sh;AGENTS.md|tools/check-doc-routes.sh;app/build.gradle.kts|tools/check-jvm-test-graph-selftest.sh;buildSrc/*|tools/check-jvm-test-graph-selftest.sh;openspec/*|tools/check-openspec-hygiene.sh;openspec/*|tools/check-openspec-hygiene-selftest.sh;tools/check-openspec-hygiene*|tools/check-openspec-hygiene.sh;tools/check-openspec-hygiene*|tools/check-openspec-hygiene-selftest.sh;app/build.gradle.kts|tools/check-gate-artifacts-selftest.sh;core/build.gradle.kts|tools/check-gate-artifacts-selftest.sh;buildSrc/*|tools/check-gate-artifacts-selftest.sh;app/src/main/cpp/libosmscout/*|tools/check-gate-artifacts-selftest.sh;tools/check-gate-artifacts*|tools/check-gate-artifacts-selftest.sh"

# The one submodule a fresh worktree does not inherit, if the project has one. Empty for a project with
# none, and read only when the project carries a `.gitmodules` (D4): the path is the project's, not the
# loop's, and no script under `tools/loop/` names one.
LOOP_SUBMODULE_PATH="app/src/main/cpp/libosmscout"

# What a kept worktree keeps, and what it loses. The run keeps its worktree so the next run inherits a warm
# *checkout* — the sources and the git state — and not a warm *build*: the module build directories below
# are regenerated by the next build and read by no item, and removing them is what keeps the kept tree from
# growing by gigabytes per run (issue #210: 3.2 GB kept, of which 1.9 GB was `app/build`, on a root
# filesystem at 88 %). The list is this project's, so it lives here and never in a phase; a project with no
# build system records an empty value. `worktree.sh strip-scratch` removes exactly these, only inside
# `$LOOP_WORKTREE`, never following a symlink out of it and never touching a path git tracks, and
# `tools/loop/loop-clean.sh` reports and removes what a tree it was not asked to strip still carries.
LOOP_WORKTREE_SCRATCH_PATHS="app/build auto/build core/build buildSrc/build osmscout-client-java/build"

# What a review round's diff leaves out: one git pathspec, applied as an *exclusion* when the run writes
# `review-<round>.diff`, and named to the reviewer in its own prompt so the absence is never read as a missing
# artefact (issue #204). Empty for a project whose change records carry no generated tree, and then the diff is
# the whole change. Measured (issue #204): item #126's round-3 diff was 435 KB and 9 935 changed lines, of
# which 9 364 (94.3 %) were archived gate HTML and XML against 112 lines of Kotlin; re-measured on the run's own
# file, 10 883 lines with 9 574 of them inside `evidence/`. It excludes a directory tree and not an extension,
# because a `.txt` a reviewer must read can live outside it.
LOOP_REVIEW_EXCLUDE_PATHSPEC=":(exclude,glob)**/evidence/**"
