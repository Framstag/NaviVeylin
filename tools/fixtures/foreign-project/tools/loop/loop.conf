# tools/loop/loop.conf — the foreign project's run defaults and its three project keys.
#
# The loop's engine names no skill, no command and no project value; everything that IS this project's
# lives here and in `tools/tooling.json`. This fixture's point is the last key: **the gate command is
# empty**, so the phases must still complete and the report must say the gate was skipped rather than
# inventing a tally or failing (tooling-portability, D2).

# ── the budget defaults ─────────────────────────────────────────────────────────────────────────
LOOP_ITEMS_DEFAULT=1
LOOP_MINUTES_DEFAULT=30
LOOP_REVIEW_DEFAULT=off
LOOP_MAY_CLOSE_DEFAULT=yes
LOOP_MAX_DECISIONS_DEFAULT=1
# The review budget: the engine refuses a run whose review round count is zero or absent, so a port has to
# record it here like every other budget default (issue #198).
LOOP_MAX_REVIEW_ROUNDS_DEFAULT=2
LOOP_ITEM_FLOOR_MINUTES=5
# Whether a difference in the project's own tree decides an item. A complete configuration declares every
# budget default the engine reads, and this one was missing when the key landed (issue #290): `off` is the
# value for a tree a run does not own exclusively, and the fixture is a throwaway tree of its own.
LOOP_STRICT_OUTSIDE_WRITE_DEFAULT=off

# ── the three project-specific keys ─────────────────────────────────────────────────────────────

# How a child process is started — the stub `pi` the self-test puts on PATH.
LOOP_AGENT_CMD="pi --print"

# This project uses no skill names; the placeholder is substituted with nothing.
LOOP_WORKER_SKILLS=""

# This project has no build system: the phases run, the gate is nothing, and the report says so.
LOOP_GATE_CMD=""

# The branch this project's items descend from, recorded here because the name is the project's: this
# fixture's base is `trunk`, not the engine's `main`. Written as a fill-if-unset expansion because the file is
# sourced after the environment — an inherited `LOOP_BASE_REF` wins, an unset one takes the branch recorded here.
LOOP_BASE_REF="${LOOP_BASE_REF:-trunk}"
