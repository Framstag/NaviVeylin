# tools/loop/loop.conf — the foreign project's run defaults and its three project keys.
#
# The loop's engine names no skill, no command and no project value; everything that IS this project's
# lives here and in `tools/tooling.json`. This fixture's point is the last key: **the gate command is
# empty**, so the phases must still complete and the report must say the gate was skipped rather than
# inventing a tally or failing (tooling-portability, D2).

# ── the budget defaults ─────────────────────────────────────────────────────────────────────────
LOOP_ITEMS_DEFAULT=1
LOOP_MINUTES_DEFAULT=30
LOOP_REVIEW_DEFAULT=off
LOOP_MAY_CLOSE_DEFAULT=yes
LOOP_MAX_DECISIONS_DEFAULT=1
LOOP_ITEM_FLOOR_MINUTES=5

# ── the three project-specific keys ─────────────────────────────────────────────────────────────

# How a child process is started — the stub `pi` the self-test puts on PATH.
LOOP_AGENT_CMD="pi --print"

# This project uses no skill names; the placeholder is substituted with nothing.
LOOP_WORKER_SKILLS=""

# This project has no build system: the phases run, the gate is nothing, and the report says so.
LOOP_GATE_CMD=""
